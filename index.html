        const DIATONIC_STEPS = [0, 0, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6]; 
        const ACCIDENTALS = ['', '♯', '', '♭', '', '', '♯', '', '♭', '', '♭', ''];

        function getPitchName(pitchClass, contextKey = 'C') {
            const preferFlatKeys = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'Cb'];
            const useFlat = preferFlatKeys.includes(contextKey) || contextKey.includes('b');
            const pitchObj = CHROMATIC_PITCHES.find(p => p.id === pitchClass);
            if (!pitchObj) return 'C';
            return useFlat ? pitchObj.altName : pitchObj.defaultName;
        }

        function getPracticalKeyName(pitchClass, rawName, isMinor = false) {
            if (!isMinor) {
                if (rawName === 'G#' || rawName === 'G#m') return 'Ab';
                if (rawName === 'D#' || rawName === 'D#m') return 'Eb';
                if (rawName === 'A#') return 'Bb';
                if (rawName === 'E#') return 'F';
                if (rawName === 'B#') return 'C';
            }
            return rawName;
        }

        function getPitchFrequency(pitchClass, octave = 4) {
            const semitonesFromA4 = (octave - 4) * 12 + (pitchClass - 9);
            return 440 * Math.pow(2, semitonesFromA4 / 12);
        }

        function generateStructureNotes(rootPitch, keyName, structure, isMinor = false) {
            const degreeNamesMap = isMinor ? DEGREE_NAMES_MINOR : DEGREE_NAMES_MAJOR;
            let currentOctave = 4;
            let previousPitchClass = -1;

            return structure.intervals.map((interval, idx) => {
                const pitchClass = (rootPitch + interval) % 12;
                
                if (idx > 0 && pitchClass <= previousPitchClass) {
                    currentOctave += Math.floor((rootPitch + interval) / 12) - Math.floor((rootPitch + structure.intervals[idx - 1]) / 12) || 1;
                }
                previousPitchClass = pitchClass;

                const noteName = getPitchName(pitchClass, keyName);
                const degree = structure.degrees[idx] || `${idx + 1}`;
                const degreeName = degreeNamesMap[degree] || 'Nota';
                const frequency = getPitchFrequency(pitchClass, currentOctave);

                const totalSemitones = (currentOctave - 4) * 12 + pitchClass;
                const diatonicStep = (currentOctave - 4) * 7 + DIATONIC_STEPS[pitchClass];
                const usesOctaveKey = totalSemitones >= 14;

                return {
                    pitchClass,
                    noteName,
                    degree,
                    degreeName,
                    frequency,
                    octave: currentOctave,
                    diatonicStep,
                    usesOctaveKey
                };
            });
        }

        function getRelativeKey(pitchClass, currentKeyName, isMinor) {
            if (isMinor) {
                const relPitch = (pitchClass + 3) % 12;
                const relName = getPracticalKeyName(relPitch, getPitchName(relPitch, 'C'), false);
                return { pitchClass: relPitch, keyName: relName, mode: 'major', title: `${relName} Mayor` };
            } else {
                const relPitch = (pitchClass + 9) % 12;
                const relName = getPracticalKeyName(relPitch, getPitchName(relPitch, 'C'), true);
                return { pitchClass: relPitch, keyName: relName, mode: 'minor', title: `${relName} Menor` };
            }
        }

        let audioCtx = null;

        function playInstrumentPitch(freq, duration = 0.6, engine = 'piano', saxType = 'alto') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (engine === 'sax') {
                    /* REALISTIC ACOUSTIC SAXOPHONE SYNTHESIS ENGINE */
                    const oscPrimary = audioCtx.createOscillator();
                    const oscSecondary = audioCtx.createOscillator();
                    const subOsc = audioCtx.createOscillator();
                    
                    const mainGain = audioCtx.createGain();
                    const filter1 = audioCtx.createBiquadFilter();
                    const filter2 = audioCtx.createBiquadFilter();
                    const formantFilter = audioCtx.createBiquadFilter();

                    // Saxophone registers & acoustic body resonances
                    if (saxType === 'soprano') {
                        oscPrimary.type = 'sawtooth';
                        oscSecondary.type = 'triangle';
                        subOsc.type = 'sine';

                        filter1.type = 'bandpass';
                        filter1.frequency.setValueAtTime(freq * 1.8, now);
                        filter1.Q.setValueAtTime(2.2, now);

                        formantFilter.type = 'peaking';
                        formantFilter.frequency.setValueAtTime(1800, now);
                        formantFilter.gain.setValueAtTime(6, now);
                    } else if (saxType === 'tenor') {
                        oscPrimary.type = 'sawtooth';
                        oscSecondary.type = 'sawtooth';
                        subOsc.type = 'triangle';

                        filter1.type = 'lowpass';
                        filter1.frequency.setValueAtTime(freq * 2.8, now);

                        formantFilter.type = 'peaking';
                        formantFilter.frequency.setValueAtTime(650, now);
                        formantFilter.gain.setValueAtTime(7, now);
                    } else {
                        // Alto Saxophone (default)
                        oscPrimary.type = 'sawtooth';
                        oscSecondary.type = 'triangle';
                        subOsc.type = 'sine';

                        filter1.type = 'lowpass';
                        filter1.frequency.setValueAtTime(freq * 3.5, now);

                        formantFilter.type = 'peaking';
                        formantFilter.frequency.setValueAtTime(1100, now);
                        formantFilter.gain.setValueAtTime(5, now);
                    }

                    // Natural Vibrato LFO (5.2 Hz)
                    const vibrato = audioCtx.createOscillator();
                    const vibratoGain = audioCtx.createGain();
                    vibrato.frequency.setValueAtTime(5.2, now);
                    vibratoGain.gain.setValueAtTime(0, now);
                    vibratoGain.gain.linearRampToValueAtTime(freq * 0.015, now + 0.2); // Delayed natural vibrato
                    vibrato.connect(oscPrimary.frequency);
                    vibrato.connect(oscSecondary.frequency);
                    vibrato.start(now);

                    // Reed Attack Chiff / Breath noise transient
                    const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < noiseBuffer.length; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const noiseSource = audioCtx.createBufferSource();
                    noiseSource.buffer = noiseBuffer;
                    const noiseFilter = audioCtx.createBiquadFilter();
                    noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.setValueAtTime(2400, now);
                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.08, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                    noiseSource.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(mainGain);

                    // Frequency detuning for natural warmth
                    oscPrimary.frequency.setValueAtTime(freq, now);
                    oscSecondary.frequency.setValueAtTime(freq * 1.002, now);
                    subOsc.frequency.setValueAtTime(freq * 0.5, now);

                    // Audio Routing
                    oscPrimary.connect(filter1);
                    oscSecondary.connect(filter1);
                    subOsc.connect(filter2);
                    filter1.connect(formantFilter);
                    filter2.connect(formantFilter);
                    formantFilter.connect(mainGain);

                    // ADSR Envelope
                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.35, now + 0.04); // Smooth breath attack
                    mainGain.gain.setValueAtTime(0.35, now + duration - 0.15);
                    mainGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    mainGain.connect(audioCtx.destination);

                    oscPrimary.start(now);
                    oscSecondary.start(now);
                    subOsc.start(now);
                    noiseSource.start(now);

                    oscPrimary.stop(now + duration);
                    oscSecondary.stop(now + duration);
                    subOsc.stop(now + duration);
                    vibrato.stop(now + duration);

                } else {
                    /* GERMAN CLASSICAL GRAND PIANO SYNTHESIS ENGINE */
                    const masterGain = audioCtx.createGain();
                    
                    // Fundamental & Harmonics array simulating German Classical Piano strings
                    const partials = [
                        { mult: 1.0,  gain: 0.55, decay: 1.0 },
                        { mult: 2.0,  gain: 0.25, decay: 0.8 },
                        { mult: 3.0,  gain: 0.15, decay: 0.6 },
                        { mult: 4.01, gain: 0.08, decay: 0.4 },
                        { mult: 5.98, gain: 0.04, decay: 0.3 }
                    ];

                    partials.forEach((p) => {
                        const pOsc = audioCtx.createOscillator();
                        const pGain = audioCtx.createGain();

                        pOsc.type = p.mult === 1.0 ? 'triangle' : 'sine';
                        pOsc.frequency.setValueAtTime(freq * p.mult, now);

                        // String decay rate
                        const pDecay = duration * p.decay;
                        pGain.gain.setValueAtTime(0, now);
                        pGain.gain.linearRampToValueAtTime(p.gain, now + 0.008); // Sharp hammer strike
                        pGain.gain.exponentialRampToValueAtTime(0.0001, now + pDecay);

                        pOsc.connect(pGain);
                        pGain.connect(masterGain);

                        pOsc.start(now);
                        pOsc.stop(now + pDecay);
                    });

                    // Acoustic Piano Soundboard Filter
                    const soundboardFilter = audioCtx.createBiquadFilter();
                    soundboardFilter.type = 'lowpass';
                    soundboardFilter.frequency.setValueAtTime(Math.min(freq * 4.5, 8000), now);
                    soundboardFilter.Q.setValueAtTime(1.0, now);

                    masterGain.connect(soundboardFilter);
                    soundboardFilter.connect(audioCtx.destination);
                }
            } catch (err) {
                console.warn('Audio play error:', err);
            }
        }

                                <ellipse cx="140" cy="30" rx="6" ry="12" className={getKeyClass(k.palmD)} strokeWidth="2" />

        function MusicalStaffDiagram({ activeNotes, selectedNoteIndex, onSelectNote, soundEngine, selectedSax, isDarkMode }) {

                                const isSelected = selectedNoteIndex === idx;

                                const baseE4Y = 105;
                                const lineSpacing = 7.5;
                                const diatonicStepFromE4 = (note.diatonicStep !== undefined ? note.diatonicStep : idx) - 2;

                                    <g key={idx} onClick={() => onSelectNote(idx, note.frequency)} className="cursor-pointer group">

                                            <line x1={stepX - 12} y1={120} x2={stepX + 12} y2={120} stroke="#94a3b8" strokeWidth="2" />

                                            <line x1={stepX - 12} y1={30} x2={stepX + 12} y2={30} stroke="#94a3b8" strokeWidth="2" />

                                            x1={noteY > 75 ? stepX + 6 : stepX - 6}

                                            x2={noteY > 75 ? stepX + 6 : stepX - 6} 
                                            y2={noteY > 75 ? noteY - 26 : noteY + 26}

                                            <text x={stepX - 16} y={noteY + 4} fill="#e2e8f0" fontSize="13" fontWeight="bold">

        function GeminiAiAssistant({ currentKey, currentSax, isDarkMode }) {
            const [isOpen, setIsOpen] = React.useState(false);

            const chatEndRef = React.useRef(null);

            React.useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const handleSend = async () => {
                if (!inputQuery.trim() || isLoading) return;

                const userMsg = inputQuery;
                setInputQuery('');
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setIsLoading(true);

                try {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const systemInstruction = `Eres un virtuoso del saxofón, pianista y profesor experto en teoría musical para la app "Jag2Sax Transpositor".
                    El usuario está trabajando actualmente con el ${currentSax.name} en la tonalidad de ${currentKey}.
                    Responde siempre de manera concisa, clara, didáctica y en español entusiasta con formato Markdown sencillo.`;

                    const payload = {
                        contents: messages.concat({ role: 'user', text: userMsg }).map(m => ({
                            role: m.role === 'model' ? 'model' : 'user',
                            parts: [{ text: m.text }]
                        })),
                        systemInstruction: {
                            parts: [{ text: systemInstruction }]
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const replyText = result?.candidates?.[0]?.content?.parts?.[0]?.text || 'No pude obtener una respuesta en este momento. Inténtalo de nuevo.';

                    setMessages(prev => [...prev, { role: 'model', text: replyText }]);

        function App() {
            const [selectedInputKey, setSelectedInputKey] = React.useState(INPUT_KEYS[0]);
            const [selectedSax, setSelectedSax] = React.useState(SAXOPHONES[1]);
            const [keyMode, setKeyMode] = React.useState('major');
            const [direction, setDirection] = React.useState('pianoToSax');
            const [soundEngine, setSoundEngine] = React.useState('piano');
            const [selectedNoteIndex, setSelectedNoteIndex] = React.useState(0);
            const [isDarkMode, setIsDarkMode] = React.useState(true);
            const [isPlayingScale, setIsPlayingScale] = React.useState(false);
            const [showTableModal, setShowTableModal] = React.useState(false);
            const [isRelativeSelected, setIsRelativeSelected] = React.useState(false);

            const activeStructures = React.useMemo(() => {
                return keyMode === 'minor' ? STRUCTURES_MINOR : STRUCTURES_MAJOR;
            }, [keyMode]);

            const [selectedStructure, setSelectedStructure] = React.useState(STRUCTURES_MAJOR[0]);

            React.useEffect(() => {
                setSelectedStructure(keyMode === 'minor' ? STRUCTURES_MINOR[0] : STRUCTURES_MAJOR[0]);
                setSelectedNoteIndex(0);
                setIsRelativeSelected(false);
            }, [keyMode]);

            const computedTransposedPitchAndName = React.useMemo(() => {
                const isPianoToSax = direction === 'pianoToSax';
                const chart = keyMode === 'minor' ? PRACTICAL_CHART_MINOR : PRACTICAL_CHART_MAJOR;

                if (isPianoToSax) {
                    const match = chart.find(row => row.piano === selectedInputKey.key);
                    if (match) {
                        const saxKeyName = match[selectedSax.id] || match.soprano;
                        const pitchObj = INPUT_KEYS.find(k => k.key === saxKeyName) || CHROMATIC_PITCHES.find(p => p.defaultName === saxKeyName || p.altName === saxKeyName);
                        const pitchClass = pitchObj ? (pitchObj.pitch !== undefined ? pitchObj.pitch : pitchObj.id) : 0;
                        return { pitchClass, keyName: saxKeyName };
                    }
                } else {
                    const match = chart.find(row => row[selectedSax.id] === selectedInputKey.key);
                    if (match) {
                        const pianoKeyName = match.piano;
                        const pitchObj = INPUT_KEYS.find(k => k.key === pianoKeyName);
                        const pitchClass = pitchObj ? pitchObj.pitch : 0;
                        return { pitchClass, keyName: pianoKeyName };
                    }
                }

                const offset = isPianoToSax ? selectedSax.offsetToSax : selectedSax.offsetToPiano;
                const resultPitch = (selectedInputKey.pitch + offset) % 12;
                const rawKeyName = getPitchName(resultPitch, selectedInputKey.key);
                const practicalName = getPracticalKeyName(resultPitch, rawKeyName, keyMode === 'minor');

                return {
                    pitchClass: resultPitch,
                    keyName: practicalName
                };
            }, [selectedInputKey, selectedSax, direction, keyMode]);

            const effectiveTransposedData = React.useMemo(() => {
                if (isRelativeSelected) {
                    const rel = getRelativeKey(computedTransposedPitchAndName.pitchClass, computedTransposedPitchAndName.keyName, keyMode === 'minor');
                    return { pitchClass: rel.pitchClass, keyName: rel.keyName, isMinor: rel.mode === 'minor', title: rel.title };
                }
                return { pitchClass: computedTransposedPitchAndName.pitchClass, keyName: computedTransposedPitchAndName.keyName, isMinor: keyMode === 'minor', title: '' };
            }, [computedTransposedPitchAndName, isRelativeSelected, keyMode]);

            const transposedKeyName = effectiveTransposedData.keyName;
            const transposedPitch = effectiveTransposedData.pitchClass;

            const activeNotes = React.useMemo(() => {
                return generateStructureNotes(transposedPitch, transposedKeyName, selectedStructure, effectiveTransposedData.isMinor);
            }, [transposedPitch, transposedKeyName, selectedStructure, effectiveTransposedData]);

            const pianoConcertNotes = React.useMemo(() => {
                return generateStructureNotes(selectedInputKey.pitch, selectedInputKey.key, selectedStructure, keyMode === 'minor');
            }, [selectedInputKey, selectedStructure, keyMode]);

            const activeSelectedNote = activeNotes[selectedNoteIndex] || activeNotes[0];

            const toggleTheme = () => {
                setIsDarkMode(!isDarkMode);
                if (!isDarkMode) {
                    document.documentElement.classList.add('dark');

                    setTimeout(() => {
                        setSelectedNoteIndex(index);
                        playInstrumentPitch(note.frequency, 0.6, soundEngine, selectedSax.id);

                            setTimeout(() => setIsPlayingScale(false), 500);
                        }
                    }, index * 380);
                });

            return (
                <div className={`min-h-screen p-3 md:p-6 pb-20 ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'}`}>

                                </h1>
                                <p className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Herramienta de transposición armónica para Piano y Saxofones</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">

                                onClick={() => setShowTableModal(true)}

                                    isDarkMode
                                    ? 'bg-amber-500/10 text-amber-400 border-amber-500/30 hover:bg-amber-500/20'
                                    : 'bg-amber-500/20 text-amber-900 border-amber-500/50 hover:bg-amber-500/30'
                                }`}

                                <span>📋</span>

                            </button>

                            <button
                                onClick={toggleTheme}
                                className={`p-2.5 rounded-xl border text-sm transition ${
                                    isDarkMode ? 'bg-slate-900 border-slate-800 text-amber-400' : 'bg-white border-slate-300 text-slate-800 shadow-sm'
                                }`}
                            >
                                {isDarkMode ? '🌙' : '☀️'}
                            </button>
                        </div>
                    </header>

                    {/* Practical Table Modal */}
                    <PracticalTableModal
                        isOpen={showTableModal}
                        onClose={() => setShowTableModal(false)}
                        isDarkMode={isDarkMode}
                    />

                    {/* Main Workspace Grid */}
                    <main className="max-w-5xl mx-auto space-y-6">

                        {/* TONALIDAD BASE E INSTRUMENTO */}
                        <section className={`p-5 rounded-2xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-300'}`}>
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center space-x-2">
                                    <h2 className={`font-bold text-base tracking-wide ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>Tonalidad Base e Instrumento</h2>
                                </div>

                                {/* Direction Switch */}
                                <button
                                    onClick={() => setDirection(direction === 'pianoToSax' ? 'saxToPiano' : 'pianoToSax')}
                                    className={`text-xs font-bold px-3 py-1.5 rounded-xl border transition flex items-center gap-1.5 ${
                                        isDarkMode
                                        ? 'bg-blue-500/10 text-blue-400 border-blue-500/30 hover:bg-blue-500/20'
                                        : 'bg-blue-100 text-blue-900 border-blue-300 hover:bg-blue-200'
                                    }`}
                                >
                                    <span>🔄</span>
                                    <span>{direction === 'pianoToSax' ? 'Piano ➔ Saxofón' : 'Saxofón ➔ Piano'}</span>
                                </button>
                            </div>

                            {/* Key Quality Mode & Sound Selection Row */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
                                <div>
                                    <label className={`text-xs font-bold uppercase tracking-wider ${isDarkMode ? 'text-slate-400' : 'text-slate-700'} mb-2 block`}>
                                        Modo Armónico:
                                    </label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            onClick={() => setKeyMode('major')}
                                            className={`py-2 rounded-xl text-xs font-bold border transition ${
                                                keyMode === 'major'
                                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20'
                                                : isDarkMode
                                                ? 'bg-slate-800/60 border-slate-700 text-slate-300'
                                                : 'bg-slate-200/80 border-slate-300 text-slate-800 font-bold hover:bg-slate-300'
                                            }`}
                                        >
                                            ☀️ Mayor
                                        </button>
                                        <button
                                            onClick={() => setKeyMode('minor')}
                                            className={`py-2 rounded-xl text-xs font-bold border transition ${
                                                keyMode === 'minor'
                                                ? 'bg-indigo-600 text-white border-indigo-400 shadow-md shadow-indigo-600/30'
                                                : isDarkMode
                                                ? 'bg-slate-800/60 border-slate-700 text-slate-300'
                                                : 'bg-slate-200/80 border-slate-300 text-slate-800 font-bold hover:bg-slate-300'
                                            }`}
                                        >
                                            🌙 Menor
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className={`text-xs font-bold uppercase tracking-wider ${isDarkMode ? 'text-slate-400' : 'text-slate-700'} mb-2 block`}>
                                        Sonido de Reproducción:
                                    </label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            onClick={() => setSoundEngine('piano')}
                                            className={`py-2 rounded-xl text-xs font-bold border transition ${
                                                soundEngine === 'piano'
                                                ? 'bg-blue-600 text-white border-blue-400 shadow-md shadow-blue-600/30'
                                                : isDarkMode
                                                ? 'bg-slate-800/60 border-slate-700 text-slate-300'
                                                : 'bg-slate-200/80 border-slate-300 text-slate-800 font-bold hover:bg-slate-300'
                                            }`}
                                        >
                                            🎹 German Classical
                                        </button>
                                        <button
                                            onClick={() => setSoundEngine('sax')}
                                            className={`py-2 rounded-xl text-xs font-bold border transition ${
                                                soundEngine === 'sax'
                                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20'
                                                : isDarkMode
                                                ? 'bg-slate-800/60 border-slate-700 text-slate-300'
                                                : 'bg-slate-200/80 border-slate-300 text-slate-800 font-bold hover:bg-slate-300'
                                            }`}
                                        >
                                            🎷 Saxofón Real
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Pitch Class Selector Buttons */}
                            <div className="mb-5">
                                <label className={`text-xs font-bold uppercase tracking-wider ${isDarkMode ? 'text-slate-400' : 'text-slate-700'} mb-2 block`}>
                                    {direction === 'pianoToSax' ? 'Tonalidad en Piano (Concierto / C):' : `Tonalidad en ${selectedSax.name}:`}
                                </label>
                                <div className="grid grid-cols-4 sm:grid-cols-7 gap-2">
                                    {INPUT_KEYS.map((k, idx) => {
                                        const isSelected = selectedInputKey.key === k.key;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => setSelectedInputKey(k)}
                                                className={`py-2.5 rounded-xl font-bold text-sm transition border ${
                                                    isSelected
                                                    ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20 font-black'
                                                    : isDarkMode
                                                    ? 'bg-slate-800/80 border-slate-700 text-slate-200 hover:bg-slate-700'
                                                    : 'bg-slate-100 border-slate-300 text-slate-900 hover:bg-slate-200'
                                                }`}
                                            >
                                                {k.key}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Saxophone Selector Cards */}
                            <div>
                                <label className={`text-xs font-bold uppercase tracking-wider ${isDarkMode ? 'text-slate-400' : 'text-slate-700'} mb-2 block`}>
                                    Selecciona el Tipo de Saxofón:
                                </label>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    {SAXOPHONES.map((sax) => {
                                        const isSelected = selectedSax.id === sax.id;
                                        return (
                                            <button
                                                key={sax.id}
                                                onClick={() => setSelectedSax(sax)}
                                                className={`p-3.5 rounded-2xl border text-left transition flex items-center justify-between ${
                                                    isSelected
                                                    ? 'bg-amber-500/10 border-amber-500 text-amber-500 ring-2 ring-amber-500/40'
                                                    : isDarkMode
                                                    ? 'bg-slate-800/50 border-slate-800 text-slate-300 hover:bg-slate-800'
                                                    : 'bg-slate-50 border-slate-300 text-slate-800 hover:bg-slate-100'
                                                }`}
                                            >
                                                <div className="flex items-center space-x-3">
                                                    <span className="text-2xl">{sax.icon}</span>
                                                    <div>
                                                        <div className={`font-bold text-sm ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>{sax.name}</div>
                                                        <div className={`text-[10px] ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>{sax.desc}</div>
                                                    </div>
                                                </div>
                                                <span className={`text-xs font-black uppercase px-2 py-1 rounded-md border ${
                                                    isDarkMode ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-amber-100 border-amber-300 text-amber-900'
                                                }`}>
                                                    {sax.key}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* RESULT DISPLAY BANNER */}
                            <div className={`mt-5 p-4 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-3 ${
                                isDarkMode 
                                ? 'bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-transparent border-amber-500/30' 
                                : 'bg-amber-100/90 border-amber-300/80 shadow-sm'
                            }`}>
                                <div>
                                    <span className={`text-[10px] uppercase font-extrabold tracking-widest block ${isDarkMode ? 'text-amber-400' : 'text-amber-900'}`}>
                                        Tonalidad Resultante {direction === 'pianoToSax' ? `para ${selectedSax.name}` : 'para Piano (Concierto)'}
                                    </span>
                                    <h3 className={`text-2xl font-black mt-0.5 ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>
                                        {transposedKeyName} {keyMode === 'minor' ? 'Menor' : 'Mayor'}
                                    </h3>
                                </div>

                                <button
                                    onClick={handlePlayScale}
                                    disabled={isPlayingScale}
                                    className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs transition shadow-lg shadow-amber-500/30 flex items-center gap-2 disabled:opacity-50"
                                >
                                    <span>{isPlayingScale ? '🔊 Reproduciendo...' : '▶ Escuchar Escala'}</span>
                                </button>
                            </div>
                        </section>

                        {/* ESTRUCTURAS ARMÓNICAS Y ESCALAS */}
                        <section className={`p-5 rounded-2xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-300'}`}>
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center space-x-2">
                                    <h2 className={`font-bold text-base tracking-wide ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>Estructuras Armónicas y Escalas</h2>
                                </div>
                                <span className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'} font-medium`}>Modo: {effectiveTransposedData.isMinor ? 'Menor' : 'Mayor'}</span>
                            </div>

                            <div className="flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
                                <button
                                    onClick={() => {
                                        setIsRelativeSelected(!isRelativeSelected);
                                        setSelectedNoteIndex(0);
                                    }}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border flex items-center gap-1.5 ${
                                        isRelativeSelected
                                        ? 'bg-indigo-600 text-white border-indigo-400 shadow-md shadow-indigo-600/30'
                                        : isDarkMode
                                        ? 'bg-indigo-500/10 border-indigo-500/30 text-indigo-400 hover:bg-indigo-500/20'
                                        : 'bg-indigo-100 border-indigo-300 text-indigo-900 font-bold hover:bg-indigo-200'
                                    }`}
                                >
                                    <span>🔄</span>
                                    <span>{keyMode === 'minor' ? ' Ver Relativa Mayor' : ' Ver Relativa Menor'}</span>
                                </button>

                                {activeStructures.map((struct) => {
                                    const isSelected = !isRelativeSelected && selectedStructure.id === struct.id;
                                    return (
                                        <button
                                            key={struct.id}
                                            onClick={() => {
                                                setIsRelativeSelected(false);
                                                setSelectedStructure(struct);
                                                setSelectedNoteIndex(0);
                                            }}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border ${
                                                isSelected
                                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20'
                                                : isDarkMode
                                                ? 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
                                                : 'bg-slate-100 border-slate-300 text-slate-800 font-bold hover:bg-slate-200'
                                            }`}
                                        >
                                            {struct.name}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* DISPLAY DE NOTAS Y GRADOS */}
                            <div className="mt-6">
                                <div className="flex items-center justify-between mb-3">
                                    <h4 className={`text-xs uppercase font-bold tracking-wider ${isDarkMode ? 'text-slate-400' : 'text-slate-700'}`}>
                                        Notas y Grados de {isRelativeSelected ? <span className={isDarkMode ? 'text-indigo-400' : 'text-indigo-800 font-black'}>Tonalidad Relativa ({transposedKeyName} {effectiveTransposedData.isMinor ? 'Menor' : 'Mayor'})</span> : <><span className={isDarkMode ? 'text-amber-400' : 'text-amber-800 font-black'}>{selectedStructure.name}</span> ({transposedKeyName})</>}
                                    </h4>
                                    <span className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Haz clic en una nota para ver digitación</span>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2.5">
                                    {activeNotes.map((note, idx) => {
                                        const isFocused = selectedNoteIndex === idx;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => {
                                                    setSelectedNoteIndex(idx);
                                                    playInstrumentPitch(note.frequency, 0.6, soundEngine, selectedSax.id);
                                                }}
                                                className={`p-3.5 rounded-xl border flex flex-col items-center justify-between transition hover:scale-[1.03] active:scale-95 ${
                                                    isFocused
                                                    ? 'bg-gradient-to-b from-amber-500 to-amber-600 border-amber-300 text-slate-950 shadow-lg shadow-amber-500/30 ring-2 ring-amber-400 font-bold'
                                                    : isDarkMode
                                                    ? 'bg-slate-800/90 border-slate-700 text-slate-100 hover:border-amber-500/50'
                                                    : 'bg-white border-slate-300 text-slate-900 hover:border-amber-500/50 shadow-sm'
                                                }`}
                                            >
                                                <div className="flex items-center justify-between w-full">
                                                    <span className={`text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded ${
                                                        isFocused 
                                                        ? 'bg-slate-950/20 text-slate-950' 
                                                        : isDarkMode ? 'bg-slate-700/40 text-amber-400' : 'bg-amber-100 text-amber-900 font-bold'
                                                    }`}>
                                                        {note.degree}
                                                    </span>
                                                </div>

                                                <span className="text-2xl font-black my-1 tracking-tight">
                                                    {note.noteName}
                                                </span>

                                                <span className={`text-[10px] font-bold text-center leading-tight truncate w-full ${
                                                    isFocused 
                                                    ? 'text-slate-950' 
                                                    : isDarkMode ? 'text-amber-400/90' : 'text-amber-800 font-bold'
                                                }`}>
                                                    {note.degreeName}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                        </section>

                        {/* PENTAGRAMA Y ESCALA EN CLAVE DE SOL */}
                        <MusicalStaffDiagram
                            activeNotes={activeNotes}
                            selectedNoteIndex={selectedNoteIndex}
                            onSelectNote={(idx, freq) => {
                                setSelectedNoteIndex(idx);
                                playInstrumentPitch(freq, 0.6, soundEngine, selectedSax.id);
                            }}
                            soundEngine={soundEngine}
                            selectedSax={selectedSax}
                            isDarkMode={isDarkMode}
                        />

                        {/* VISUALIZADORES DUALES: TECLADO PIANO Y DIGITACIÓN SVG SAXOFÓN */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                            {/* Piano Keyboard */}
                            <section className={`md:col-span-2 p-5 rounded-2xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-300'}`}>
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 className={`font-bold text-base tracking-wide flex items-center gap-2 ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>
                                            🎹 Teclado Visualizador
                                        </h3>
                                        <p className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Resaltado de notas en el teclado de referencia</p>
                                    </div>
                                    <div className="flex items-center space-x-3 text-xs">
                                        <span className="flex items-center gap-1">
                                            <span className="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                                            <span className={isDarkMode ? 'text-slate-400' : 'text-slate-700 font-medium'}>Seleccionada</span>
                                        </span>
                                        <span className="flex items-center gap-1">
                                            <span className="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                                            <span className={isDarkMode ? 'text-slate-400' : 'text-slate-700 font-medium'}>Escala</span>
                                        </span>
                                    </div>
                                </div>

                                <div className="relative w-full overflow-x-auto pb-2">
                                    <div className="flex min-w-[550px] h-36 bg-slate-950 p-2 rounded-xl border border-slate-800 relative justify-center">
                                        {Array.from({ length: 24 }).map((_, keyIdx) => {
                                            const pitchClass = keyIdx % 12;
                                            const isBlack = [1, 3, 6, 8, 10].includes(pitchClass);
                                            const noteObj = activeNotes.find(n => n.pitchClass === pitchClass);
                                            const isFocused = activeSelectedNote && activeSelectedNote.pitchClass === pitchClass;
                                            const isScaleNote = !!noteObj;

                                            if (isBlack) return null;

                                            return (
                                                <div
                                                    key={keyIdx}
                                                    onClick={() => {
                                                        const matchedIdx = activeNotes.findIndex(n => n.pitchClass === pitchClass);
                                                        if (matchedIdx !== -1) setSelectedNoteIndex(matchedIdx);
                                                        playInstrumentPitch(getPitchFrequency(pitchClass, keyIdx < 12 ? 4 : 5), 0.6, soundEngine, selectedSax.id);
                                                    }}
                                                    className={`relative flex-1 min-w-[30px] max-w-[42px] h-full rounded-b-md border transition-all cursor-pointer flex flex-col justify-end items-center pb-2 select-none ${
                                                        isFocused
                                                        ? 'bg-amber-400 border-amber-300 text-slate-950 font-bold shadow-lg shadow-amber-500/40 z-10 scale-[1.02]'
                                                        : isScaleNote
                                                        ? 'bg-blue-500 border-blue-400 text-white font-bold z-10'
                                                        : 'bg-white border-slate-300 hover:bg-slate-100 text-slate-700'
                                                    }`}
                                                >
                                                    {[1, 3, 6, 8, 10].includes((pitchClass + 1) % 12) && (
                                                        <div
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                const blackPitch = (pitchClass + 1) % 12;
                                                                const matchedIdx = activeNotes.findIndex(n => n.pitchClass === blackPitch);
                                                                if (matchedIdx !== -1) setSelectedNoteIndex(matchedIdx);
                                                                playInstrumentPitch(getPitchFrequency(blackPitch, keyIdx < 12 ? 4 : 5), 0.6, soundEngine, selectedSax.id);
                                                            }}
                                                            className={`absolute top-0 -right-[40%] w-[80%] h-[60%] rounded-b-md border z-20 cursor-pointer flex items-end justify-center pb-1 transition ${
                                                                activeSelectedNote && activeSelectedNote.pitchClass === ((pitchClass + 1) % 12)
                                                                ? 'bg-amber-400 border-amber-300 text-slate-950 font-bold shadow-lg'
                                                                : activeNotes.some(n => n.pitchClass === ((pitchClass + 1) % 12))
                                                                ? 'bg-blue-500 border-blue-400 text-white font-bold'
                                                                : 'bg-slate-900 border-slate-800 hover:bg-slate-800 text-slate-300'
                                                            }`}
                                                        >
                                                            <span className="text-[9px]">
                                                                {getPitchName((pitchClass + 1) % 12, transposedKeyName)}
                                                            </span>
                                                        </div>
                                                    )}

                                                    <span className="text-xs font-bold">
                                                        {getPitchName(pitchClass, transposedKeyName)}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </section>

                            {/* Graphic SVG Saxophone Key Diagram */}
                            <section className="md:col-span-1">
                                <SaxophoneGraphicDiagram
                                    pitchClass={activeSelectedNote.pitchClass}
                                    noteName={activeSelectedNote.noteName}
                                    usesOctaveKey={activeSelectedNote.usesOctaveKey}
                                    isDarkMode={isDarkMode}
                                />
                            </section>

                        </div>

                        {/* GEMINI AI ASSISTANT CHAT */}
                        <GeminiAiAssistant
                            currentKey={transposedKeyName}
                            currentSax={selectedSax}
                            isDarkMode={isDarkMode}
                        />

                        {/* COMPARISON AND SUMMARY */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-300'}`}>
                                <h3 className={`font-bold text-sm tracking-wide mb-3 flex items-center gap-2 ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>
                                    🔄 Comparativa Directa Concierto vs Saxofón
                                </h3>
                                <div className="space-y-2">
                                    <div className={`p-3 rounded-xl border flex items-center justify-between text-xs ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-50 border-slate-300'}`}>
                                        <span className={`font-semibold ${isDarkMode ? 'text-blue-400' : 'text-blue-800 font-extrabold'}`}>🎹 Piano (Concierto):</span>
                                        <span className="font-mono font-bold tracking-wider text-sm">
                                            {pianoConcertNotes.map(n => n.noteName).join(' - ')}
                                        </span>
                                    </div>
                                    <div className={`p-3 rounded-xl border flex items-center justify-between text-xs ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-50 border-slate-300'}`}>
                                        <span className={`font-semibold ${isDarkMode ? 'text-amber-400' : 'text-amber-800 font-extrabold'}`}>🎷 {selectedSax.name}:</span>
                                        <span className="font-mono font-bold tracking-wider text-sm">
                                            {activeNotes.map(n => n.noteName).join(' - ')}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-300'}`}>
                                <h3 className={`font-bold text-sm tracking-wide mb-2 flex items-center gap-2 ${isDarkMode ? 'text-slate-100' : 'text-slate-900'}`}>
                                    💡 Regla de Transposición Aplicada
                                </h3>
                                <div className={`text-xs space-y-2 ${isDarkMode ? 'text-slate-400' : 'text-slate-700'} leading-relaxed`}>
                                    <p>
                                        <strong className={isDarkMode ? 'text-slate-200' : 'text-slate-900'}>Ajuste Enarmónico Inteligente:</strong> Las tonalidades teóricas como Sol♯ Mayor o Re♯ Mayor se transforman automáticamente a sus equivalentes prácticos en bemol (<span className={`font-bold ${isDarkMode ? 'text-amber-400' : 'text-amber-800'}`}>La♭ Mayor</span> y <span className={`font-bold ${isDarkMode ? 'text-amber-400' : 'text-amber-800'}`}>Mi♭ Mayor</span>).
                                    </p>
                                    <p>
                                        <strong className={isDarkMode ? 'text-slate-200' : 'text-slate-900'}>Bidireccional:</strong> Puedes cambiar en cualquier momento entre Piano ➔ Saxo o Saxo ➔ Piano mediante el conmutador superior.
                                    </p>
                                </div>
                            </div>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className={`max-w-5xl mx-auto px-4 mt-8 pt-4 border-t border-slate-700/50 text-center text-xs ${isDarkMode ? 'text-slate-500' : 'text-slate-600 font-medium'}`}>
                        Jag2Sax Transpositor - Plataforma interactiva para saxofonistas y pianistas.
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
