      { piano: 'Fa menor (Fm)', soprano: 'Sol menor (Gm)', alto: 'Re menor (Dm)', tenor: 'Sol menor (Gm)' },
      { piano: 'Si♭ menor (Bbm)', soprano: 'Do menor (Cm)', alto: 'Sol menor (Gm)', tenor: 'Do menor (Cm)' },
      { piano: 'Mi♭ menor (Ebm)', soprano: 'Fa menor (Fm)', alto: 'Do menor (Cm)', tenor: 'Fa menor (Fm)' },
      { piano: 'La♭ menor (Abm)', soprano: 'Si♭ menor (Bbm)', alto: 'Fa menor (Fm)', tenor: 'Si♭ menor (Bbm)' }
    ];

    // Transposition intervals (semitones)
    // Soprano/Tenor Bb = +2 semitones
    // Alto Eb = +9 semitones (+6th major / -3 semitones)
    const TRANSPOSE_OFFSETS = {
      Soprano: 2,
      Alto: 9,
      Tenor: 2
    };

    // Practical key mapping to convert theoretical keys with 5+ sharps/flats to standard forms
    const PRACTICAL_MAPPING = {
      'G#': 'Ab',
      'D#': 'Eb',
      'A#': 'Bb',
      'E#': 'F',
      'B#': 'C',
      'C♭': 'B',
      'F♭': 'E'
    };

    function normalizeNote(note) {
      if (!note) return 'C';
      const clean = note.replace('m', '');
      return PRACTICAL_MAPPING[clean] || clean;
    }

    function transposeNote(note, semitones) {
      const baseNote = normalizeNote(note);
      const idx = CHROMATIC_SCALE.indexOf(baseNote);
      if (idx === -1) return note;
      let targetIdx = (idx + semitones) % 12;
      if (targetIdx < 0) targetIdx += 12;
      return CHROMATIC_SCALE[targetIdx];
    }

    const DEGREE_NAMES_MAJOR = ['Tónica', 'Supertónica', 'Mediante', 'Subdominante', 'Dominante', 'Superdominante', 'Sensible'];
    const DEGREE_NAMES_MINOR = ['Tónica', 'Supertónica', 'Mediante', 'Subdominante', 'Dominante', 'Superdominante', 'Subtónica'];

    const STRUCTURE_TEMPLATES = {
      'Mayor Natural': { intervals: [0, 2, 4, 5, 7, 9, 11], type: 'scale' },
      'Menor Natural': { intervals: [0, 2, 3, 5, 7, 8, 10], type: 'scale' },

      'Menor Melódica': { intervals: [0, 2, 3, 5, 7, 9, 11], type: 'scale' },
      'Tríada Mayor': { intervals: [0, 4, 7], degrees: ['1', '3', '5'], names: ['Tónica', 'Tercera Mayor', 'Quinta Justa'] },

      'Arpegio Dominante 7': { intervals: [0, 4, 7, 10], degrees: ['1', '3', '5', 'b7'], names: ['Tónica', 'Tercera Mayor', 'Quinta Justa', 'Séptima Menor'] }

    // Traditional Saxophone Fingerings Map
    const SAX_FINGERINGS = {
      'C': { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, lowC: true, octave: false },
      'C#': { octave: false },
      'Db': { octave: false },
      'D': { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, octave: false },
      'Eb': { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, ebKey: true, octave: false },
      'E': { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, octave: false },
      'F': { lh1: true, lh2: true, lh3: true, rh1: true, octave: false },
      'F#': { lh1: true, lh2: true, lh3: true, rh2: true, octave: false },
      'G': { lh1: true, lh2: true, lh3: true, octave: false },
      'G#': { lh1: true, lh2: true, lh3: true, gsKey: true, octave: false },
      'Ab': { lh1: true, lh2: true, lh3: true, gsKey: true, octave: false },
      'A': { lh1: true, lh2: true, octave: false },
      'Bb': { lh1: true, bisBb: true, octave: false },
      'B': { lh1: true, octave: false }
    };

    function getFingering(noteName, octaveShift = false) {
      const clean = normalizeNote(noteName);
      const base = SAX_FINGERINGS[clean] || { lh1: true };
      return {
        ...base,
        octave: octaveShift || base.octave || false
      };
    }

    // --- AUDIO SYNTHESIZER (Web Audio API) ---
    class InstrumentSynth {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      getFrequency(noteName, octave = 4) {
        const clean = normalizeNote(noteName);
        const semitoneFromC = CHROMATIC_SCALE.indexOf(clean);
        if (semitoneFromC === -1) return 440;
        // C4 = ~261.63Hz
        const midi = 60 + semitoneFromC + (octave - 4) * 12;
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      playNote(noteName, type = 'piano', octave = 4, duration = 0.8) {
        this.init();
        if (!this.ctx) return;

        const freq = this.getFrequency(noteName, octave);
        const now = this.ctx.currentTime;

        if (type === 'piano') {
          // German Classical Piano Synthesis
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'triangle';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now); // 1st harmonic resonance

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.7, now + 0.015); // Hammer strike
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration);
          osc2.stop(now + duration);
        } else {
          // Realistic Saxophone Synthesis (Sawtooth + Formant Filter + Vibrato)
          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();

          osc.type = 'sawtooth';
          subOsc.type = 'triangle';

          osc.frequency.setValueAtTime(freq, now);
          subOsc.frequency.setValueAtTime(freq, now);

          // Acoustic Body Formant Filter
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(freq * 1.8, now);
          filter.Q.setValueAtTime(2.5, now);

          // Delayed Acoustic Vibrato (5.2 Hz)
          lfo.frequency.setValueAtTime(5.2, now);
          lfoGain.gain.setValueAtTime(0, now);
          lfoGain.gain.setValueAtTime(0, now + 0.15);
          lfoGain.gain.linearRampToValueAtTime(freq * 0.015, now + 0.4);

          lfo.connect(osc.frequency);
          lfo.connect(subOsc.frequency);

          // Reed Attack Chiff Envelope
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.5, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(filter);
          subOsc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          lfo.start(now);
          osc.start(now);
          subOsc.start(now);

          lfo.stop(now + duration);
          osc.stop(now + duration);
          subOsc.stop(now + duration);
        }
      }
    }

    const synth = new InstrumentSynth();

    // --- PENTAGRAM (CLEF DE SOL) COMPONENT ---
    function TrebleClefStaff({ notes, activeNoteIndex, onSelectNote }) {
      // Map note to Y position on staff
      // E4 is lowest line (y=70), F5 is top line (y=30)
      const STAFF_Y_MAP = {
        'C': 85,  // Ledger line below
        'C#': 85,
        'Db': 85,
        'D': 77.5,
        'Eb': 70,
        'E': 70,   // Line 1
        'F': 62.5, // Space 1
        'F#': 62.5,
        'G': 55,   // Line 2
        'Ab': 47.5,
        'A': 47.5, // Space 2
        'Bb': 40,
        'B': 40    // Line 3
      };

      return (
        <div className="w-full bg-slate-950 p-4 rounded-2xl border border-slate-800 shadow-inner overflow-x-auto">
          <svg viewBox="0 0 500 120" className="w-full h-32 min-w-[400px]">
            {/* 5 Staff Lines */}
            <line x1="20" y1="30" x2="480" y2="30" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="40" x2="480" y2="40" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="50" x2="480" y2="50" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="60" x2="480" y2="60" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="70" x2="480" y2="70" stroke="#475569" strokeWidth="1.5" />

            {/* Treble Clef Symbol */}
            <text x="25" y="68" fill="#f59e0b" fontSize="48" fontFamily="serif" fontWeight="bold">𝄞</text>

            {/* Render Notes on Staff */}
            {notes.map((noteObj, idx) => {
              const clean = normalizeNote(noteObj.note);
              const isAccidental = noteObj.note.includes('#') || noteObj.note.includes('b') || noteObj.note.includes('♭');
              const accidentalSymbol = noteObj.note.includes('#') ? '♯' : (isAccidental ? '♭' : '');
              
              // Base X spacing
              const xPos = 90 + idx * (360 / Math.max(notes.length - 1, 1));
              
              // Calculate Y position
              const yPos = STAFF_Y_MAP[clean] || 55;
              const isActive = activeNoteIndex === idx;

              return (
                <g key={idx} className="cursor-pointer group" onClick={() => onSelectNote(idx)}>
                  {/* Ledger Line for C4 */}
                  {yPos >= 85 && (
                    <line x1={xPos - 12} y1="85" x2={xPos + 12} y2="85" stroke="#f59e0b" strokeWidth="1.5" />
                  )}

                  {/* Accidental */}
                  {accidentalSymbol && (
                    <text x={xPos - 14} y={yPos + 4} fill={isActive ? '#38bdf8' : '#94a3b8'} fontSize="14" fontWeight="bold">
                      {accidentalSymbol}
                    </text>
                  )}

                  {/* Notehead */}
                  <ellipse 
                    cx={xPos} 
                    cy={yPos} 
                    rx="7" 
                    ry="5" 
                    fill={isActive ? '#38bdf8' : '#f59e0b'}
                    transform={`rotate(-20 ${xPos} ${yPos})`}
                    className="transition-all duration-200 group-hover:scale-125"
                  />

                  {/* Stem */}
                  <line 
                    x1={xPos + 6} 
                    y1={yPos} 
                    x2={xPos + 6} 
                    y2={yPos - 28} 
                    stroke={isActive ? '#38bdf8' : '#cbd5e1'} 
                    strokeWidth="1.5" 
                  />

                  {/* Note Name Label */}
                  <text 
                    x={xPos} 
                    y="110" 
                    textAnchor="middle" 
                    fill={isActive ? '#38bdf8' : '#f8fafc'} 
                    fontSize="12" 
                    fontWeight="bold"
                  >
                    {noteObj.note}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function GeminiModal({ isOpen, onClose }) {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('jag2sax_gemini_key') || '');
      const [savedKey, setSavedKey] = useState(() => localStorage.getItem('jag2sax_gemini_key') || '');
      const [showKeyInput, setShowKeyInput] = useState(!localStorage.getItem('jag2sax_gemini_key'));
      const [query, setQuery] = useState('');
      const [chatLog, setChatLog] = useState([
        { sender: 'ai', text: '¡Hola! Soy tu asistente de teoría musical e improvisación para saxofón y piano. ¿En qué puedo ayudarte hoy?' }
      ]);
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatLog]);

      const saveKey = () => {
        localStorage.setItem('jag2sax_gemini_key', apiKey.trim());
        setSavedKey(apiKey.trim());
        setShowKeyInput(false);
      };

      const handleSend = async () => {
        if (!query.trim()) return;

        const currentKey = savedKey || apiKey.trim();

        if (!currentKey) {
          setShowKeyInput(true);
          setChatLog(prev => [...prev, {
            sender: 'ai',
            text: '⚠️ Se requiere una API Key de Google Gemini gratuita para responder. Ingresa tu clave arriba.'
          }]);
          return;
        }

        const userMsg = query;
        setQuery('');
        setChatLog(prev => [...prev, { sender: 'user', text: userMsg }]);
        setLoading(true);

        const systemPrompt = "Eres un profesor de música experto en saxofón (soprano, alto, tenor), piano, transposición e improvisación. Responde de forma clara, motivadora, pedagógica y en español.";
        
        let attempts = 0;
        let success = false;
        let resultText = "";

        // Exponential backoff up to 5 retries
        while (attempts < 5 && !success) {
          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${currentKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userMsg }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se obtuvo respuesta.";
            success = true;
          } catch (err) {
            attempts++;
            if (attempts < 5) {
              const delay = Math.pow(2, attempts - 1) * 1000;
              await new Promise(res => setTimeout(res, delay));
            } else {
              resultText = "⚠️ Hubo un error al conectar con Google Gemini. Revisa que tu API Key sea válida o intenta de nuevo en unos momentos.";
            }
          }
        }

        setChatLog(prev => [...prev, { sender: 'ai', text: resultText }]);
        setLoading(false);
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
          <div className="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-lg h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            
            {/* Header */}
            <div className="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="text-2xl">🎷</span>
                <div>
                  <h3 className="font-bold text-amber-400">Asistente IA Musical</h3>
                  <p className="text-xs text-slate-400">Especialista en Saxofón y Armonía</p>
                </div>
              </div>
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => setShowKeyInput(!showKeyInput)}
                  className="p-1.5 bg-slate-800 text-slate-300 hover:text-amber-400 rounded-lg text-xs"
                  title="Configurar Clave API"
                >
                  ⚙️ Clave
                </button>
                <button onClick={onClose} className="p-2 text-slate-400 hover:text-white text-xl">✕</button>
              </div>
            </div>

            {/* API Key Configuration Bar */}
            {showKeyInput && (
              <div className="p-3 bg-amber-950/40 border-b border-amber-800/50 text-xs">
                <p className="text-amber-200 mb-2 font-medium">
                  Para usar la IA en la web, ingresa tu API Key gratuita de Google Gemini:
                </p>
                <div className="flex space-x-2">
                  <input
                    type="password"
                    placeholder="Pega tu API Key aquí..."
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-700 text-white rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-400"
                  />
                  <button
                    onClick={saveKey}
                    className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg"
                  >
                    Guardar
                  </button>
                </div>
                <a 
                  href="https://aistudio.google.com/app/apikey" 
                  target="_blank" 
                  rel="noreferrer"
                  className="inline-block mt-2 text-sky-400 underline hover:text-sky-300"
                >
                  👉 Consigue tu API Key GRATIS aquí (1 clic)
                </a>
              </div>
            )}

            {/* Chat Body */}
            <div className="flex-1 p-4 overflow-y-auto space-y-3">
              {chatLog.map((msg, i) => (
                <div 
                  key={i} 
                  className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                >
                  <div className={`max-w-[85%] rounded-2xl p-3 text-sm leading-relaxed ${
                    msg.sender === 'user' 
                      ? 'bg-amber-500 text-slate-950 font-medium rounded-br-none' 
                      : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700'
                  }`}>
                    {msg.text}
                  </div>
                </div>
              ))}
              {loading && (
                <div className="flex justify-start">
                  <div className="bg-slate-800 text-amber-400 rounded-2xl p-3 text-xs italic animate-pulse">
                    Pensando respuesta musical... 🎷
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* Input Footer */}
            <div className="p-3 bg-slate-950 border-t border-slate-800 flex space-x-2">
              <input
                type="text"
                placeholder="Haz una pregunta sobre saxo, escalas o acordes..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                className="flex-1 bg-slate-900 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-400"
              />
              <button
                onClick={handleSend}
                disabled={loading}
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl transition"
              >
                Enviar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      // Theme State
      const [darkMode, setDarkMode] = useState(true);

      // Core State
      const [direction, setDirection] = useState('piano-to-sax'); // 'piano-to-sax' or 'sax-to-piano'
      const [modeQuality, setModeQuality] = useState('Mayor'); // 'Mayor' or 'Menor'
      const [soundType, setSoundType] = useState('sax'); // 'piano' or 'sax'
      const [selectedKey, setSelectedKey] = useState('Eb');
      const [selectedSax, setSelectedSax] = useState('Alto'); // 'Soprano', 'Alto', 'Tenor'
      const [selectedStructure, setSelectedStructure] = useState('Menor Natural');
      const [activeNoteIdx, setActiveNoteIdx] = useState(0);

      // Modals
      const [isTableOpen, setIsTableOpen] = useState(false);
      const [isGeminiOpen, setIsGeminiOpen] = useState(false);

      // Toggle Dark Mode
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Calculate Resulting Transposed Key
      const transposedResultKey = useMemo(() => {
        const offset = TRANSPOSE_OFFSETS[selectedSax] || 2;
        const actualOffset = direction === 'piano-to-sax' ? offset : (12 - offset);
        
        const transposed = transposeNote(selectedKey, actualOffset);
        return modeQuality === 'Menor' ? `${transposed}m` : transposed;
      }, [selectedKey, selectedSax, direction, modeQuality]);

      // Calculate Relative Key
      const relativeKeyInfo = useMemo(() => {
        if (modeQuality === 'Mayor') {
          // Relative Minor is 3 semitones down
          const relMinor = transposeNote(selectedKey, -3);
          return { label: 'Relativa Menor', key: `${relMinor}m`, note: relMinor, mode: 'Menor' };
        } else {
          // Relative Major is 3 semitones up
          const relMajor = transposeNote(selectedKey, 3);
          return { label: 'Relativa Mayor', key: relMajor, note: relMajor, mode: 'Mayor' };
        }
      }, [selectedKey, modeQuality]);

      // Calculate Active Scale/Structure Notes & Degree Names
      const activeStructureNotes = useMemo(() => {
        const rootNote = normalizeNote(transposedResultKey);
        const template = STRUCTURE_TEMPLATES[selectedStructure] || STRUCTURE_TEMPLATES['Mayor Natural'];
        
        const rootIdx = CHROMATIC_SCALE.indexOf(rootNote);
        const isMinorMode = modeQuality === 'Menor' || selectedStructure.includes('Menor');

        return template.intervals.map((semitones, idx) => {
          const noteIdx = (rootIdx + semitones) % 12;
          const noteName = CHROMATIC_SCALE[noteIdx];
          
          let degName = '';
          if (template.names) {
            degName = template.names[idx];
          } else {
            degName = isMinorMode ? DEGREE_NAMES_MINOR[idx] : DEGREE_NAMES_MAJOR[idx];
          }

          return {
            note: noteName,
            degreeName: degName || `Grado ${idx + 1}`
          };
        });
      }, [transposedResultKey, selectedStructure, modeQuality]);

      // Get current active note for Sax Fingering
      const currentActiveNote = activeStructureNotes[activeNoteIdx]?.note || 'C';
      const currentFingering = getFingering(currentActiveNote, activeNoteIdx >= 4);

      // Play Scale Sequence
      const handlePlayScale = () => {
        activeStructureNotes.forEach((noteObj, idx) => {
          setTimeout(() => {
            setActiveNoteIdx(idx);
            synth.playNote(noteObj.note, soundType, idx >= 4 ? 5 : 4, 0.6);
          }, idx * 400);
        });
      };

      // Play Single Note
      const handleSelectNote = (idx) => {
        setActiveNoteIdx(idx);
        const note = activeStructureNotes[idx].note;
        synth.playNote(note, soundType, idx >= 4 ? 5 : 4, 0.8);
      };

      // Toggle Relative Mode
      const handleToggleRelative = () => {
        if (modeQuality === 'Mayor') {
          setModeQuality('Menor');
          setSelectedKey(relativeKeyInfo.note);
          setSelectedStructure('Menor Natural');
        } else {
          setModeQuality('Mayor');
          setSelectedKey(relativeKeyInfo.note);
          setSelectedStructure('Mayor Natural');
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-3 py-6 space-y-6">
          
          {/* HEADER BRANDING */}
          <header className="flex items-center justify-between bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 shadow-md">
            <div className="flex items-center space-x-3">
              <div className="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                🎷
              </div>
              <div>
                <h1 className="text-xl font-black text-slate-900 dark:text-amber-400 tracking-tight">
                  Jag2Sax <span className="text-amber-600 dark:text-slate-200">Transpositor</span>
                </h1>
                <p className="text-xs text-slate-600 dark:text-slate-400 font-medium">
                  Herramienta de transposición armónica para Piano y Saxofones
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-2">

              <button
                onClick={handleToggleRelative}
                className="flex-shrink-0 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-500/30 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
              >
                🔄 Ver {relativeKeyInfo.label} ({relativeKeyInfo.key})
              </button>

              {Object.keys(STRUCTURE_TEMPLATES).map((struct) => (
                <button
                  key={struct}
                  onClick={() => setSelectedStructure(struct)}
                  className={`flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                    selectedStructure === struct
                      ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-md'
                      : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                  }`}
                >
                  {struct}
                </button>
              ))}
            </div>

            {/* NOTES & DEGREES INTERACTIVE CARDS */}
            <div>
              <div className="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 mb-2">
                <span className="font-bold text-slate-900 dark:text-slate-200">
                  Notas y Grados de {selectedStructure.toUpperCase()} ({transposedResultKey})
                </span>
                <span>Haz clic en una nota para ver digitación</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">
                {activeStructureNotes.map((noteObj, idx) => {
                  const isActive = activeNoteIdx === idx;
                  return (
                    <div
                      key={idx}
                      onClick={() => handleSelectNote(idx)}
                      className={`cursor-pointer p-3 rounded-2xl border text-center transition ${
                        isActive
                          ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-lg scale-105'
                          : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                      }`}
                    >
                      <span className="text-[10px] font-black uppercase tracking-wider block opacity-75">
                        {noteObj.degreeName}
                      </span>
                      <span className="text-xl font-black block my-1">
                        {noteObj.note}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* SECTION 3: PENTAGRAMA Y DIGITACIÓN */}
          <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md space-y-5">
            <div className="border-b border-slate-200 dark:border-slate-800 pb-3">
              <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                Pentagrama y Escala en Clave de Sol (Saxofón)
              </h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Visualización de lectura real en clave de Sol
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              {/* Pentagram Display (2 Cols) */}
              <div className="lg:col-span-2">
                <TrebleClefStaff 
                  notes={activeStructureNotes} 
                  activeNoteIndex={activeNoteIdx}
                  onSelectNote={handleSelectNote}
                />
              </div>

              {/* Saxophone Fingering Graphic (1 Col) */}
              <div className="lg:col-span-1 flex justify-center">
                <SaxFingeringDiagram 
                  fingering={currentFingering} 
                  noteName={currentActiveNote} 
                />
              </div>
            </div>
          </section>

          {/* FLOATING GEMINI AI ASSISTANT BUTTON */}
          <button
            onClick={() => setIsGeminiOpen(true)}
            className="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold px-4 py-3 rounded-full shadow-2xl hover:scale-105 transition flex items-center gap-2 text-sm border border-amber-300"
          >
            <span>🎷</span>
            <span>Consultar IA Musical</span>
          </button>

          {/* MODALS */}
          <TableModal isOpen={isTableOpen} onClose={() => setIsTableOpen(false)} />
          <GeminiModal isOpen={isGeminiOpen} onClose={() => setIsGeminiOpen(false)} />

        </div>
      );
    }

    // Render React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
