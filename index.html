    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const CHROMATIC_SCALE = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

    const PRACTICAL_CHART_MAJOR = [

    const PRACTICAL_CHART_MINOR = [
      { piano: 'La menor (Am)', soprano: 'Si menor (Bm)', alto: 'Fa# menor (F#m)', tenor: 'Si menor (Bm)', note: 'A' },

      { piano: 'Fa# menor (F#m)', soprano: 'Sol# menor (G#m)', alto: 'Re# menor (D#m)', tenor: 'Sol# menor (G#m)', note: 'F#' },
      { piano: 'Do# menor (C#m)', soprano: 'Re# menor (D#m)', alto: 'La# menor (A#m)', tenor: 'Re# menor (D#m)', note: 'C#' },
      { piano: 'Re menor (Dm)', soprano: 'Mi menor (Em)', alto: 'Si menor (Bm)', tenor: 'Mi menor (Em)', note: 'D' },
      { piano: 'Sol menor (Gm)', soprano: 'La menor (Am)', alto: 'Mi menor (Em)', tenor: 'La menor (Am)', note: 'G' },
      { piano: 'Do menor (Cm)', soprano: 'Re menor (Dm)', alto: 'La menor (Am)', tenor: 'Re menor (Dm)', note: 'C' },
      { piano: 'Fa menor (Fm)', soprano: 'Sol menor (Gm)', alto: 'Re menor (Dm)', tenor: 'Sol menor (Gm)', note: 'F' },
      { piano: 'Si♭ menor (Bbm)', soprano: 'Do menor (Cm)', alto: 'Sol menor (Gm)', tenor: 'Do menor (Cm)', note: 'Bb' },
      { piano: 'Mi♭ menor (Ebm)', soprano: 'Fa menor (Fm)', alto: 'Do menor (Cm)', tenor: 'Fa menor (Fm)', note: 'Eb' },
      { piano: 'La♭ menor (Abm)', soprano: 'Si♭ menor (Bbm)', alto: 'Fa menor (Fm)', tenor: 'Si♭ menor (Bbm)', note: 'Ab' }
    ];

    const TRANSPOSE_OFFSETS = {
      Soprano: 2,
      Alto: 9,
      Tenor: 2
    };

    const PRACTICAL_MAPPING = {
      'G#': 'Ab',
      'D#': 'Eb',
      'A#': 'Bb',
      'E#': 'F',
      'B#': 'C',
      'C♭': 'B',
      'F♭': 'E',
      'Gb': 'F#'
    };

    function normalizeNote(note) {
      if (!note) return 'C';
      const clean = note.replace('m', '').trim();
      return PRACTICAL_MAPPING[clean] || clean;
    }

    function transposeNote(note, semitones) {
      const baseNote = normalizeNote(note);
      const idx = CHROMATIC_SCALE.indexOf(baseNote);
      if (idx === -1) return note;
      let targetIdx = (idx + semitones) % 12;
      if (targetIdx < 0) targetIdx += 12;
      return CHROMATIC_SCALE[targetIdx];
    }

    const DEGREE_NAMES_MAJOR = ['Tónica', 'Supertónica', 'Mediante', 'Subdominante', 'Dominante', 'Superdominante', 'Sensible'];
    const DEGREE_NAMES_MINOR = ['Tónica', 'Supertónica', 'Mediante', 'Subdominante', 'Dominante', 'Superdominante', 'Subtónica'];

    const STRUCTURE_TEMPLATES = {
      'Mayor Natural': { intervals: [0, 2, 4, 5, 7, 9, 11] },
      'Menor Natural': { intervals: [0, 2, 3, 5, 7, 8, 10] },
      'Menor Armónica': { intervals: [0, 2, 3, 5, 7, 8, 11] },
      'Menor Melódica': { intervals: [0, 2, 3, 5, 7, 9, 11] },
      'Tríada Mayor': { intervals: [0, 4, 7], names: ['Tónica', 'Tercera Mayor', 'Quinta Justa'] },
      'Tríada Menor': { intervals: [0, 3, 7], names: ['Tónica', 'Tercera Menor', 'Quinta Justa'] },
      'Pentatónica Mayor': { intervals: [0, 2, 4, 7, 9], names: ['Tónica', 'Supertónica', 'Mediante', 'Dominante', 'Superdominante'] },
      'Pentatónica Menor': { intervals: [0, 3, 5, 7, 10], names: ['Tónica', 'Mediante', 'Subdominante', 'Dominante', 'Subtónica'] },
      'Arpegio Mayor 7': { intervals: [0, 4, 7, 11], names: ['Tónica', 'Tercera Mayor', 'Quinta Justa', 'Séptima Mayor'] },
      'Arpegio Dominante 7': { intervals: [0, 4, 7, 10], names: ['Tónica', 'Tercera Mayor', 'Quinta Justa', 'Séptima Menor'] }
    };

    const SAX_FINGERINGS_MAP = {
      'C': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, lowC: true } },
        octave2: { standard: { lh2: true, octave: true } },
        octave3: { standard: { lh2: true, octave: true } }
      },
      'C#': {
        octave1: { standard: { lowCs: true } },
        octave2: { standard: { octave: true } },
        octave3: { standard: { octave: true } }
      },
      'Db': {
        octave1: { standard: { lowCs: true } },
        octave2: { standard: { octave: true } },
        octave3: { standard: { octave: true } }
      },
      'D': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, octave: true } },
        octave3: { standard: { octave: true, palmD: true } }
      },
      'Eb': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, ebKey: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, ebKey: true, octave: true } },
        octave3: { standard: { octave: true, palmD: true, palmEb: true } }
      },
      'E': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, octave: true } },
        octave3: { standard: { octave: true, palmD: true, palmEb: true, sideE: true } }
      },
      'F': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, rh1: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, rh1: true, octave: true } },
        octave3: { standard: { octave: true, palmD: true, palmEb: true, palmF: true, sideE: true } }
      },
      'F#': {
        octave1: { 
          standard: { lh1: true, lh2: true, lh3: true, rh2: true },
          alt: { lh1: true, lh2: true, lh3: true, rh1: true, sideFSharp: true }
        },
        octave2: { 
          standard: { lh1: true, lh2: true, lh3: true, rh2: true, octave: true },
          alt: { lh1: true, lh2: true, lh3: true, rh1: true, sideFSharp: true, octave: true }
        },
        octave3: { standard: { octave: true, palmD: true, palmEb: true, palmF: true, sideFSharp: true } }
      },
      'G': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, octave: true } },
        octave3: { standard: { octave: true, frontF: true, lh1: true, lh3: true, rh1: true, sideBb: true } }
      },
      'G#': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, gsKey: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, gsKey: true, octave: true } },
        octave3: { standard: { octave: true, frontF: true, lh1: true, gsKey: true } }
      },
      'Ab': {
        octave1: { standard: { lh1: true, lh2: true, lh3: true, gsKey: true } },
        octave2: { standard: { lh1: true, lh2: true, lh3: true, gsKey: true, octave: true } },
        octave3: { standard: { octave: true, frontF: true, lh1: true, gsKey: true } }
      },
      'A': {
        octave1: { standard: { lh1: true, lh2: true } },
        octave2: { standard: { lh1: true, lh2: true, octave: true } },
        octave3: { standard: { octave: true, lh2: true, lh3: true, rh1: true, rh2: true } }
      },
      'Bb': {
        octave1: { 
          standard: { lh1: true, bisBb: true },
          alt: { lh1: true, lh2: true, sideBb: true }
        },
        octave2: { 
          standard: { lh1: true, bisBb: true, octave: true },
          alt: { lh1: true, lh2: true, sideBb: true, octave: true }
        },
        octave3: { standard: { octave: true, lh1: true, rh1: true, sideBb: true } }
      },
      'B': {
        octave1: { standard: { lh1: true } },
        octave2: { standard: { lh1: true, octave: true } },
        octave3: { standard: { octave: true, lh1: true, lh3: true, rh1: true } }
      }
    };

    function getFingeringData(noteName, octaveChoice = 2, isAlt = false) {
      const clean = normalizeNote(noteName);
      const noteEntry = SAX_FINGERINGS_MAP[clean] || SAX_FINGERINGS_MAP['C'];
      
      const octaveKey = octaveChoice === 1 ? 'octave1' : (octaveChoice === 3 ? 'octave3' : 'octave2');
      const octaveData = noteEntry[octaveKey] || noteEntry['octave2'] || noteEntry['octave1'];
      
      const fingering = isAlt && octaveData.alt ? octaveData.alt : octaveData.standard;
      const hasAltOption = !!octaveData.alt;

      return { fingering, hasAltOption };
    }

    class InstrumentSynth {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      getFrequency(noteName, octave = 4) {
        const clean = normalizeNote(noteName);
        const semitoneFromC = CHROMATIC_SCALE.indexOf(clean);
        if (semitoneFromC === -1) return 440;
        const midi = 60 + semitoneFromC + (octave - 4) * 12;
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      playNote(noteName, type = 'piano', octave = 4, duration = 0.8) {
        this.init();
        if (!this.ctx) return;

        const freq = this.getFrequency(noteName, octave);
        const now = this.ctx.currentTime;

        if (type === 'piano') {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'triangle';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.7, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration);
          osc2.stop(now + duration);
        } else {
          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();

          osc.type = 'sawtooth';
          subOsc.type = 'triangle';

          osc.frequency.setValueAtTime(freq, now);
          subOsc.frequency.setValueAtTime(freq, now);

          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(freq * 1.8, now);
          filter.Q.setValueAtTime(2.5, now);

          lfo.frequency.setValueAtTime(5.2, now);
          lfoGain.gain.setValueAtTime(0, now);
          lfoGain.gain.setValueAtTime(0, now + 0.15);
          lfoGain.gain.linearRampToValueAtTime(freq * 0.015, now + 0.4);

          lfo.connect(osc.frequency);
          lfo.connect(subOsc.frequency);

          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.5, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(filter);
          subOsc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          lfo.start(now);
          osc.start(now);
          subOsc.start(now);

          lfo.stop(now + duration);
          osc.stop(now + duration);
          subOsc.stop(now + duration);
        }
      }
    }

    const synth = new InstrumentSynth();

    function SaxFingeringDiagram({ fingering, noteName, octaveChoice, setOctaveChoice, isAlt, setIsAlt, hasAltOption }) {

            Digitación Tradicional — Saxofón

          {/* Vector graphic built strictly matching digitacion saxofon_2.png */}
          <svg viewBox="0 0 200 570" className="w-48 h-[26rem] drop-shadow-md">

            <polygon points="22,160 38,92 42,162 24,166" {...getKeyProps(f.octave)} />

            {/* 3. LH MAIN STACK CIRCLES */}
            <circle cx="100" cy="80" r="25" {...getKeyProps(f.lh1)} />
            <circle cx="128" cy="118" r="9" {...getKeyProps(f.bisBb)} />
            <circle cx="100" cy="148" r="25" {...getKeyProps(f.lh2)} />
            <circle cx="100" cy="222" r="25" {...getKeyProps(f.lh3)} />

            {/* 4. PALM KEYS (Top Right Ovals - Palm D, Eb, F) */}
            <ellipse cx="152" cy="58" rx="8" ry="19" transform="rotate(15 152 58)" {...getKeyProps(f.palmD)} />
            <ellipse cx="174" cy="82" rx="8" ry="19" transform="rotate(20 174 82)" {...getKeyProps(f.palmEb)} />
            <ellipse cx="158" cy="120" rx="8" ry="19" transform="rotate(15 158 120)" {...getKeyProps(f.palmF)} />

            {/* 5. LEFT PINKY KEY TABLE (Cluster of 4 keys on the right of LH stack) */}
            <g transform="translate(132, 204)">
              {/* Top Oval Key: Sol# / G# Key */}
              <ellipse cx="28" cy="14" rx="27" ry="12" {...getKeyProps(f.gsKey)} />

              {/* Middle Left Key: Si Grave / Low B Key */}
              <rect x="1" y="28" width="26" height="28" rx="5" {...getKeyProps(f.lowB)} />

              {/* Middle Right Key: Do# Grave / Low C# Key */}
              <rect x="29" y="28" width="26" height="28" rx="5" {...getKeyProps(f.lowCs)} />

              {/* Bottom Capsule Key: Si♭ Grave / Low Bb Key */}

            </g>

            {/* 6. SIDE KEYS (Narrow Vertical Rectangles on Left Side of RH Stack) */}
            <g transform="translate(42, 292)">
              <rect x="0" y="0" width="11" height="38" rx="3" {...getKeyProps(f.sideE)} />
              <rect x="0" y="42" width="11" height="38" rx="3" {...getKeyProps(f.sideC)} />
              <rect x="0" y="84" width="11" height="38" rx="3" {...getKeyProps(f.sideBb)} />
            </g>

            {/* 7. RH MAIN STACK CIRCLES & AUX KEYS */}
            <circle cx="100" cy="310" r="25" {...getKeyProps(f.rh1)} />
            <rect x="64" y="344" width="10" height="25" rx="3" {...getKeyProps(f.sideFSharp)} />
            <circle cx="100" cy="385" r="25" {...getKeyProps(f.rh2)} />
            <rect x="52" y="422" width="10" height="25" rx="3" {...getKeyProps(f.lowC)} />
            <circle cx="100" cy="460" r="25" {...getKeyProps(f.rh3)} />

            {/* 8. BOTTOM PINKY KEYS (Low Eb & Low C Stacked Capsules) */}
            <g transform="translate(70, 502)">
              <rect x="0" y="0" width="60" height="24" rx="12" {...getKeyProps(f.ebKey)} />
              <rect x="0" y="27" width="60" height="24" rx="12" {...getKeyProps(f.lowC)} />
            </g>

          </svg>

          {/* CONTROLS FOR OCTAVES AND ALTERNATIVE VARIANTS */}
          <div className="w-full mt-3 space-y-2 border-t border-slate-800 pt-3">
            <div className="flex items-center justify-between">
              <span className="text-[11px] text-slate-400 font-medium">Octava:</span>
              <div className="flex space-x-1">
                {[1, 2, 3].map((oct) => (
                  <button
                    key={oct}
                    onClick={() => setOctaveChoice(oct)}
                    className={`px-2.5 py-1 text-[11px] font-bold rounded-md transition ${
                      octaveChoice === oct
                        ? 'bg-rose-500 text-white shadow-md'
                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                    }`}
                  >
                    {oct === 2 ? '2ª (8va)' : (oct === 3 ? '3ª (Aguda)' : '1ª')}
                  </button>
                ))}
              </div>
            </div>

            {hasAltOption && (
              <div className="flex items-center justify-between">
                <span className="text-[11px] text-slate-400 font-medium">Variante:</span>
                <div className="flex space-x-1">
                  <button
                    onClick={() => setIsAlt(false)}
                    className={`px-2 py-1 text-[11px] font-bold rounded-md transition ${
                      !isAlt ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                    }`}
                  >
                    Estándar
                  </button>
                  <button
                    onClick={() => setIsAlt(true)}
                    className={`px-2 py-1 text-[11px] font-bold rounded-md transition ${
                      isAlt ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'
                    }`}
                  >
                    Alternativo
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function TrebleClefStaff({ notes, activeNoteIndex, onSelectNote }) {
      const STAFF_Y_MAP = {
        'C': 85,   // 1st Ledger line below
        'C#': 85,
        'Db': 85,
        'D': 77.5, // Space below 1st line
        'Eb': 70,
        'E': 70,   // Line 1
        'F': 62.5, // Space 1
        'F#': 62.5,
        'G': 55,   // Line 2 (Clef Center)
        'Ab': 47.5,
        'A': 47.5, // Space 2
        'Bb': 40,
        'B': 40    // Line 3

    function DraggableAiButton({ onClick }) {
      const [pos, setPos] = useState({ x: window.innerWidth - 180, y: window.innerHeight - 80 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const initialPosRef = useRef({ x: 0, y: 0 });
      const hasDraggedRef = useRef(false);

      useEffect(() => {
        const handleResize = () => {
          setPos(prev => ({
            x: Math.min(prev.x, window.innerWidth - 160),
            y: Math.min(prev.y, window.innerHeight - 70)
          }));
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const handlePointerDown = (e) => {
        setIsDragging(true);
        hasDraggedRef.current = false;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        dragStartRef.current = { x: clientX, y: clientY };
        initialPosRef.current = { ...pos };
      };

      const handlePointerMove = useCallback((e) => {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);

        const dx = clientX - dragStartRef.current.x;
        const dy = clientY - dragStartRef.current.y;

        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          hasDraggedRef.current = true;
        }

        const newX = Math.max(10, Math.min(window.innerWidth - 170, initialPosRef.current.x + dx));
        const newY = Math.max(10, Math.min(window.innerHeight - 70, initialPosRef.current.y + dy));

        setPos({ x: newX, y: newY });
      }, [isDragging]);

      const handlePointerUp = useCallback(() => {
        setIsDragging(false);
      }, []);

      useEffect(() => {
        if (isDragging) {
          window.addEventListener('mousemove', handlePointerMove);
          window.addEventListener('mouseup', handlePointerUp);
          window.addEventListener('touchmove', handlePointerMove, { passive: false });
          window.addEventListener('touchend', handlePointerUp);
        } else {
          window.removeEventListener('mousemove', handlePointerMove);
          window.removeEventListener('mouseup', handlePointerUp);
          window.removeEventListener('touchmove', handlePointerMove);
          window.removeEventListener('touchend', handlePointerUp);
        }
        return () => {
          window.removeEventListener('mousemove', handlePointerMove);
          window.removeEventListener('mouseup', handlePointerUp);
          window.removeEventListener('touchmove', handlePointerMove);
          window.removeEventListener('touchend', handlePointerUp);
        };
      }, [isDragging, handlePointerMove, handlePointerUp]);

      const handleClick = (e) => {
        if (!hasDraggedRef.current) {
          onClick();
        }
      };

      return (
        <div
          style={{ left: `${pos.x}px`, top: `${pos.y}px` }}
          onMouseDown={handlePointerDown}
          onTouchStart={handlePointerDown}
          onClick={handleClick}
          className="fixed z-40 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold px-4 py-3 rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-transform flex items-center gap-2 text-sm border border-amber-300 cursor-grab active:cursor-grabbing touch-none select-none"
        >
          <span className="text-base pointer-events-none">🎷</span>
          <span className="pointer-events-none">Consultar IA</span>
          <span className="text-xs opacity-60 pointer-events-none">⋮⋮</span>
        </div>
      );
    }

      const handleSend = async () => {
        if (!query.trim()) return;

        const userMsg = query;
        setQuery('');
        setChatLog(prev => [...prev, { sender: 'user', text: userMsg }]);
        setLoading(true);

        let attempts = 0;
        let success = false;
        let resultText = "";

        while (attempts < 5 && !success) {
          try {
            const response = await fetch('https://jag2sax-ai.jaguzmangonzalez.workers.dev', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userMsg: userMsg })
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              throw new Error(errData.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se obtuvo respuesta.";
            success = true;
          } catch (err) {
            attempts++;
            if (attempts < 5) {
              const delay = Math.pow(2, attempts - 1) * 1000;
              await new Promise(res => setTimeout(res, delay));
            } else {
              resultText = `⚠️ Error de conexión: ${err.message}`;

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const transposedResultKey = useMemo(() => {
        const offset = TRANSPOSE_OFFSETS[selectedSax] || 2;
        const actualOffset = direction === 'piano-to-sax' ? offset : (12 - offset);
        
        const transposed = transposeNote(selectedKey, actualOffset);
        return modeQuality === 'Menor' ? `${transposed}m` : transposed;
      }, [selectedKey, selectedSax, direction, modeQuality]);

      const relativeKeyInfo = useMemo(() => {
        if (modeQuality === 'Mayor') {
          const relMinor = transposeNote(selectedKey, -3);
          return { label: 'Relativa Menor', key: `${relMinor}m`, note: relMinor, mode: 'Menor' };
        } else {
          const relMajor = transposeNote(selectedKey, 3);
          return { label: 'Relativa Mayor', key: relMajor, note: relMajor, mode: 'Mayor' };
        }

      const activeStructureNotes = useMemo(() => {
        const rootNote = normalizeNote(transposedResultKey);
        const template = STRUCTURE_TEMPLATES[selectedStructure] || STRUCTURE_TEMPLATES['Mayor Natural'];

        const isMinorMode = modeQuality === 'Menor' || selectedStructure.includes('Menor');

        return template.intervals.map((semitones, idx) => {
          const noteIdx = (rootIdx + semitones) % 12;
          const noteName = CHROMATIC_SCALE[noteIdx];
          
          let degName = '';
          if (template.names) {
            degName = template.names[idx];

            degName = isMinorMode ? DEGREE_NAMES_MINOR[idx] : DEGREE_NAMES_MAJOR[idx];

          return {
            note: noteName,

          };

                    className={`py-2.5 text-sm font-bold rounded-xl border transition ${
                      selectedKey === note
                        ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-md scale-105'
                        : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                    }`}
                  >
                    {note}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="text-xs font-bold text-slate-700 dark:text-slate-400 uppercase tracking-wider block mb-2">
                Selecciona el Tipo de Saxofón:
              </label>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[
                  { name: 'Soprano', tag: 'BB', desc: 'Transposición en Si♭ (+1 Tono arriba)' },
                  { name: 'Alto', tag: 'EB', desc: 'Transposición en Mi♭ (+6ta Mayor / -3 semitones)' },
                  { name: 'Tenor', tag: 'BB', desc: 'Transposición en Si♭ (+1 Tono arriba octava baja)' }
                ].map((sax) => (
                  <div
                    key={sax.name}
                    onClick={() => setSelectedSax(sax.name)}
                    className={`cursor-pointer p-3.5 rounded-2xl border transition flex items-center justify-between ${
                      selectedSax === sax.name
                        ? 'bg-amber-500/10 border-amber-500 text-slate-900 dark:text-amber-300 shadow-md'
                        : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-400'
                    }`}
                  >
                    <div>
                      <h3 className="font-bold text-sm">Saxo {sax.name}</h3>
                      <p className="text-[11px] opacity-75">{sax.desc}</p>
                    </div>
                    <span className="text-xs font-black bg-slate-900 text-amber-400 px-2 py-1 rounded-md">
                      {sax.tag}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-gradient-to-r from-amber-500/20 to-amber-600/10 border border-amber-500/40 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <span className="text-[11px] font-bold text-slate-700 dark:text-amber-400 uppercase tracking-wider block">
                  Tonalidad Resultante para Saxo {selectedSax}:
                </span>
                <span className="text-2xl font-black text-slate-900 dark:text-slate-100">
                  {transposedResultKey}
                </span>
              </div>

              <button
                onClick={handlePlayScale}
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
              >
                ▶ Escuchar Escala
              </button>
            </div>
          </section>

          {/* ESTRUCTURAS ARMÓNICAS Y ESCALAS */}
          <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
              <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                Estructuras Armónicas y Escalas
              </h2>
              <span className="text-xs font-bold text-slate-500 dark:text-slate-400">
                Modo: {modeQuality}
              </span>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
              <button
                onClick={handleToggleRelative}
                className="flex-shrink-0 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-500/30 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
              >
                🔄 Ver {relativeKeyInfo.label} ({relativeKeyInfo.key})
              </button>

              {Object.keys(STRUCTURE_TEMPLATES).map((struct) => (
                <button
                  key={struct}
                  onClick={() => setSelectedStructure(struct)}
                  className={`flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                    selectedStructure === struct
                      ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-md'
                      : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                  }`}
                >
                  {struct}
                </button>
              ))}
            </div>

            <div>
              <div className="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 mb-2">
                <span className="font-bold text-slate-900 dark:text-slate-200">
                  Notas y Grados de {selectedStructure.toUpperCase()} ({transposedResultKey})
                </span>
                <span>Haz clic en una nota para ver digitación</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">
                {activeStructureNotes.map((noteObj, idx) => {
                  const isActive = activeNoteIdx === idx;
                  return (
                    <div
                      key={idx}
                      onClick={() => handleSelectNote(idx)}
                      className={`cursor-pointer p-3 rounded-2xl border text-center transition ${
                        isActive
                          ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-lg scale-105'
                          : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                      }`}
                    >
                      <span className="text-[10px] font-black uppercase tracking-wider block opacity-75">
                        {noteObj.degreeName}
                      </span>
                      <span className="text-xl font-black block my-1">
                        {noteObj.note}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* PENTAGRAMA Y DIGITACIÓN */}
          <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md space-y-5">
            <div className="border-b border-slate-200 dark:border-slate-800 pb-3">
              <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                Pentagrama y Escala en Clave de Sol (Saxofón)
              </h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Visualización de lectura real en clave de Sol
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              <div className="lg:col-span-2">
                <TrebleClefStaff 
                  notes={activeStructureNotes} 
                  activeNoteIndex={activeNoteIdx}
                  onSelectNote={handleSelectNote}
                />
              </div>

              <div className="lg:col-span-1 flex justify-center">
                <SaxFingeringDiagram 
                  fingering={fingering} 
                  noteName={currentActiveNote} 
                  octaveChoice={octaveChoice}
                  setOctaveChoice={setOctaveChoice}
                  isAlt={isAlt}
                  setIsAlt={setIsAlt}
                  hasAltOption={hasAltOption}
                />
              </div>
            </div>
          </section>

          {/* DRAGGABLE FLOATING AI BUTTON */}
          <DraggableAiButton onClick={() => setIsGeminiOpen(true)} />

          {/* MODALS */}
          <TableModal 
            isOpen={isTableOpen} 
            onClose={() => setIsTableOpen(false)} 
            onSelectKey={handleSelectFromTable}
          />
          <GeminiModal isOpen={isGeminiOpen} onClose={() => setIsGeminiOpen(false)} />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
