<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300">

    <script type="text/babel">

        // Pitch classes in chromatic sequence
        const CHROMATIC_PITCHES = [
            { id: 0, defaultName: 'C', altName: 'C' },
            { id: 1, defaultName: 'C#', altName: 'Db' },
            { id: 2, defaultName: 'D', altName: 'D' },
            { id: 3, defaultName: 'Eb', altName: 'D#' },
            { id: 4, defaultName: 'E', altName: 'E' },
            { id: 5, defaultName: 'F', altName: 'F' },
            { id: 6, defaultName: 'F#', altName: 'Gb' },
            { id: 7, defaultName: 'G', altName: 'G' },
            { id: 8, defaultName: 'Ab', altName: 'G#' },
            { id: 9, defaultName: 'A', altName: 'A' },
            { id: 10, defaultName: 'Bb', altName: 'A#' },
            { id: 11, defaultName: 'B', altName: 'B' }
        ];

        // Piano Key Options (Concert Pitch)
        const PIANO_KEYS = [
            { key: 'C', pitch: 0, type: 'natural' },
            { key: 'C#', pitch: 1, type: 'sharp' },
            { key: 'Db', pitch: 1, type: 'flat' },
            { key: 'D', pitch: 2, type: 'natural' },
            { key: 'Eb', pitch: 3, type: 'flat' },
            { key: 'E', pitch: 4, type: 'natural' },
            { key: 'F', pitch: 5, type: 'natural' },
            { key: 'F#', pitch: 6, type: 'sharp' },
            { key: 'Gb', pitch: 6, type: 'flat' },
            { key: 'G', pitch: 7, type: 'natural' },
            { key: 'Ab', pitch: 8, type: 'flat' },
            { key: 'A', pitch: 9, type: 'natural' },
            { key: 'Bb', pitch: 10, type: 'flat' },
            { key: 'B', pitch: 11, type: 'natural' }
        ];

        // Saxophone definitions
        const SAXOPHONES = [
            {
                id: 'soprano',
                name: 'Saxo Soprano',
                key: 'Bb',
                offset: 2, // Major 2nd up
                desc: 'Transposición en Bb (+1 Tono arriba)',
                icon: '🎷',
                register: 'Agudo'
            },
            {
                id: 'alto',
                name: 'Saxo Alto',
                key: 'Eb',
                offset: 9, // Major 6th up

            {

                key: 'Bb',

        // Scale degree names mapping dictionary
        const DEGREE_NAMES = {
            '1': 'Tónica',
            '2': 'Supertónica',
            'b3': 'Mediante Menor',
            '3': 'Mediante',
            '4': 'Subdominante',
            'b5': 'Tritono / 5ta Disminuida',
            '5': 'Dominante',
            'b6': 'Superdominante Menor',
            '6': 'Superdominante',
            'b7': 'Subtónica',
            '7': 'Sensible'
        };

        // Harmonic Structures and Interval definitions
        const STRUCTURES = [
            {
                id: 'major_scale',
                category: 'Escalas',
                name: 'Escala Mayor (Natural)',
                intervals: [0, 2, 4, 5, 7, 9, 11],
                degrees: ['1', '2', '3', '4', '5', '6', '7']
            },
            {

            {

                category: 'Pentatónicas',
                name: 'Pentatónica Mayor',
                intervals: [0, 2, 4, 7, 9],
                degrees: ['1', '2', '3', '5', '6']

            {

            },
            {

                name: 'Escala de Blues',
                intervals: [0, 3, 5, 6, 7, 10],
                degrees: ['1', 'b3', '4', 'b5', '5', 'b7']

            {
                id: 'harmonic_minor',
                category: 'Menores',
                name: 'Menor Armónica',
                intervals: [0, 2, 3, 5, 7, 8, 11],
                degrees: ['1', '2', 'b3', '4', '5', 'b6', '7']
            },
            {
                id: 'melodic_minor',
                category: 'Menores',
                name: 'Menor Melódica',
                intervals: [0, 2, 3, 5, 7, 9, 11],
                degrees: ['1', '2', 'b3', '4', '5', '6', '7']
            },
            {
                id: 'dom_7',
                category: 'Acordes 7ma',
                name: '7ma Dominante',
                intervals: [0, 4, 7, 10],
                degrees: ['1', '3', '5', 'b7']
            },
            {
                id: 'maj_7',
                category: 'Acordes 7ma',
                name: '7ma Mayor (Maj7)',
                intervals: [0, 4, 7, 11],
                degrees: ['1', '3', '5', '7']
            }
        ];

        // Standard Saxophone Fingerings database for pitch classes 0..11
        const SAX_FINGERINGS = {
            0: { name: 'C', keys: { lh2: true, c: true } },
            1: { name: 'C# / Db', keys: { open: true } },
            2: { name: 'D', keys: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true } },
            3: { name: 'Eb / D#', keys: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, eb: true } },
            4: { name: 'E', keys: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true } },
            5: { name: 'F', keys: { lh1: true, lh2: true, lh3: true, rh1: true } },
            6: { name: 'F# / Gb', keys: { lh1: true, lh2: true, lh3: true, rh2: true } },
            7: { name: 'G', keys: { lh1: true, lh2: true, lh3: true } },
            8: { name: 'G# / Ab', keys: { lh1: true, lh2: true, lh3: true, gis: true } },
            9: { name: 'A', keys: { lh1: true, lh2: true } },
            10: { name: 'Bb / A#', keys: { lh1: true, bis: true } },
            11: { name: 'B', keys: { lh1: true } }
        };

        let audioCtx = null;

        function playInstrumentPitch(frequency, duration = 0.6, soundMode = 'piano', saxType = 'alto') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (soundMode === 'piano') {
                    // Grand Piano Synthesis
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    osc1.type = 'triangle';
                    osc2.type = 'sine';

                    osc1.frequency.setValueAtTime(frequency, now);
                    osc2.frequency.setValueAtTime(frequency * 2, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1800, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + duration);

                    gainNode.gain.setValueAtTime(0.001, now);
                    gainNode.gain.linearRampToValueAtTime(0.5, now + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc1.connect(filter);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + duration);
                    osc2.stop(now + duration);

                } else if (soundMode === 'sax') {
                    // Realistic Saxophone Timbre
                    const osc = audioCtx.createOscillator();
                    const subOsc = audioCtx.createOscillator();
                    const vibrato = audioCtx.createOscillator();
                    const vibratoGain = audioCtx.createGain();
                    const gainNode = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    let filterCutoff = 1400;
                    if (saxType === 'soprano') filterCutoff = 2200;
                    if (saxType === 'tenor') filterCutoff = 950;

                    osc.type = 'sawtooth';
                    subOsc.type = 'square';

                    osc.frequency.setValueAtTime(frequency, now);
                    subOsc.frequency.setValueAtTime(frequency * 0.5, now);

                    vibrato.frequency.setValueAtTime(5.2, now);
                    vibratoGain.gain.setValueAtTime(frequency * 0.015, now);
                    vibrato.connect(osc.frequency);

                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(filterCutoff, now);
                    filter.Q.setValueAtTime(1.8, now);

                    gainNode.gain.setValueAtTime(0.001, now);
                    gainNode.gain.linearRampToValueAtTime(0.35, now + 0.08);
                    gainNode.gain.setValueAtTime(0.35, now + duration - 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc.connect(filter);
                    subOsc.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    vibrato.start(now);
                    osc.start(now);
                    subOsc.start(now);

                    vibrato.stop(now + duration);
                    osc.stop(now + duration);
                    subOsc.stop(now + duration);
                }
            } catch (e) {
                console.error('Audio Synthesis Error:', e);
            }
        }

        function getPitchFrequency(pitchClass, octave = 4) {
            const midiNote = (octave + 1) * 12 + pitchClass;
            return 440 * Math.pow(2, (midiNote - 69) / 12);
        }

        function getTransposedPitch(concertPitch, offsetSemis) {
            return (concertPitch + offsetSemis) % 12;
        }

        const PREFERRED_SPELLINGS = {
            'C':  ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G':  ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
            'D':  ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
            'A':  ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
            'E':  ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
            'B':  ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'],
            'F#': ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#'],
            'F':  ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
            'Gb': ['Gb', 'Ab', 'Bb', 'Cb', 'Db', 'Eb', 'F'],
            'C#': ['C#', 'D#', 'E#', 'F#', 'G#', 'A#', 'B#']
        };

        function getPitchName(pitchClass, keyContext = 'C') {
            const preferFlats = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(keyContext);
            const pitch = CHROMATIC_PITCHES.find(p => p.id === pitchClass);
            if (!pitch) return '?';
            return preferFlats ? (pitch.altName.includes('b') ? pitch.altName : pitch.defaultName) : pitch.defaultName;
        }

        function generateStructureNotes(rootPitchClass, rootKeyName, structure) {
            return structure.intervals.map((interval, idx) => {
                const pitchClass = (rootPitchClass + interval) % 12;
                let noteName = getPitchName(pitchClass, rootKeyName);

                if (PREFERRED_SPELLINGS[rootKeyName] && structure.intervals.length === 7) {
                    noteName = PREFERRED_SPELLINGS[rootKeyName][idx] || noteName;
                }

                const degreeCode = structure.degrees[idx] || '';
                const degreeName = DEGREE_NAMES[degreeCode] || `Grado ${idx + 1}`;

                return {
                    pitchClass,
                    noteName,
                    degree: degreeCode,
                    degreeName,
                    interval,
                    frequency: getPitchFrequency(pitchClass, interval < 0 ? 3 : 4)
                };
            });
        }

        function SaxophoneKeysDiagram({ pitchClass, noteName, isDarkMode }) {

                            </g>

                            <g>
                                <circle cx="95" cy="158" r="11" className={getKeyClass(k.lh2)} />

                            </g>

                            <g>
                                <circle cx="95" cy="340" r="11" className={getKeyClass(k.rh3)} />

                            </g>

                            <g>
                                <rect x="112" y="355" width="20" height="12" rx="4" className={getKeyClass(k.eb)} />
                                <text x="115" y="364" fill="#ffffff" fontSize="8" fontWeight="bold">Eb</text>
                            </g>
                            <g>
                                <rect x="112" y="372" width="20" height="12" rx="4" className={getKeyClass(k.c)} />
                                <text x="117" y="381" fill="#ffffff" fontSize="8" fontWeight="bold">C</text>
                            </g>
                        </svg>
                    </div>
                </div>
            );
        }

        function App() {
            const [selectedPianoKey, setSelectedPianoKey] = React.useState(PIANO_KEYS[0]);
            const [selectedSax, setSelectedSax] = React.useState(SAXOPHONES[1]);
            const [selectedStructure, setSelectedStructure] = React.useState(STRUCTURES[0]);
            const [soundEngine, setSoundEngine] = React.useState('piano');
            const [selectedNoteIndex, setSelectedNoteIndex] = React.useState(0);
            const [isDarkMode, setIsDarkMode] = React.useState(true);
            const [isPlayingScale, setIsPlayingScale] = React.useState(false);
            const [showTutorial, setShowTutorial] = React.useState(false);

            const transposedPitch = React.useMemo(() => {
                return getTransposedPitch(selectedPianoKey.pitch, selectedSax.offset);
            }, [selectedPianoKey, selectedSax]);

            const transposedKeyName = React.useMemo(() => {
                if (selectedSax.key === 'Eb') {
                    const mapEb = {
                        'C': 'A', 'C#': 'A#', 'Db': 'Bb', 'D': 'B', 'Eb': 'C',
                        'E': 'C#', 'F': 'D', 'F#': 'D#', 'Gb': 'Eb', 'G': 'E',
                        'Ab': 'F', 'A': 'F#', 'Bb': 'G', 'B': 'G#'
                    };
                    return mapEb[selectedPianoKey.key] || getPitchName(transposedPitch, 'C');
                } else if (selectedSax.key === 'Bb') {
                    const mapBb = {
                        'C': 'D', 'C#': 'D#', 'Db': 'Eb', 'D': 'E', 'Eb': 'F',
                        'E': 'F#', 'F': 'G', 'F#': 'G#', 'Gb': 'Ab', 'G': 'A',
                        'Ab': 'Bb', 'A': 'B', 'Bb': 'C', 'B': 'C#'
                    };
                    return mapBb[selectedPianoKey.key] || getPitchName(transposedPitch, 'C');
                }
                return getPitchName(transposedPitch, selectedPianoKey.key);
            }, [selectedPianoKey, selectedSax, transposedPitch]);

            const activeNotes = React.useMemo(() => {
                return generateStructureNotes(transposedPitch, transposedKeyName, selectedStructure);
            }, [transposedPitch, transposedKeyName, selectedStructure]);

            const pianoConcertNotes = React.useMemo(() => {
                return generateStructureNotes(selectedPianoKey.pitch, selectedPianoKey.key, selectedStructure);
            }, [selectedPianoKey, selectedStructure]);

            const activeSelectedNote = activeNotes[selectedNoteIndex] || activeNotes[0];

            const toggleTheme = () => {
                setIsDarkMode(!isDarkMode);
                if (!isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            const handlePlayScale = () => {
                if (isPlayingScale) return;
                setIsPlayingScale(true);
                
                activeNotes.forEach((note, index) => {
                    setTimeout(() => {
                        setSelectedNoteIndex(index);
                        playInstrumentPitch(note.frequency, 0.5, soundEngine, selectedSax.id);
                        if (index === activeNotes.length - 1) {
                            setTimeout(() => setIsPlayingScale(false), 500);
                        }
                    }, index * 380);
                });
            };

            return (
                <div className={`min-h-screen ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'} transition-colors duration-200 pb-12`}>
                    
                    {/* Header Bar */}
                    <header className={`sticky top-0 z-50 backdrop-blur-md border-b ${isDarkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-white/80 border-slate-200'} px-4 py-3 shadow-md`}>
                        <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-amber-500/20">
                                    🎷
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight leading-none flex items-center gap-2">
                                        Transpositor <span className="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/30 font-medium">Saxo & Piano</span>
                                    </h1>
                                    <p className="text-xs text-slate-400 mt-0.5">Transposición e interpretación armónica</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2">
                                <div className={`flex items-center rounded-lg border p-1 text-xs ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                                    <span className="text-[10px] text-slate-400 font-bold px-2 uppercase">Sonido:</span>
                                    <button
                                        onClick={() => setSoundEngine('piano')}
                                        className={`px-2.5 py-1 rounded-md font-bold transition ${
                                            soundEngine === 'piano'
                                            ? 'bg-blue-600 text-white shadow'
                                            : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        🎹 Grand Piano
                                    </button>
                                    <button
                                        onClick={() => setSoundEngine('sax')}
                                        className={`px-2.5 py-1 rounded-md font-bold transition ${
                                            soundEngine === 'sax'
                                            ? 'bg-amber-500 text-slate-950 shadow'
                                            : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        🎷 Saxo Realista
                                    </button>
                                </div>

                                <button
                                    onClick={toggleTheme}
                                    className={`p-2 rounded-lg border text-xs font-semibold transition ${
                                        isDarkMode 
                                        ? 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-amber-400' 
                                        : 'bg-white border-slate-200 hover:bg-slate-100 text-slate-700'
                                    }`}
                                >
                                    {isDarkMode ? '☀️ Claro' : '🌙 Escenario'}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 py-6 space-y-6">

                        {/* PASO 1: SELECCIÓN DE TONALIDAD Y SAXOFÓN */}
                        <section className={`p-5 rounded-2xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center space-x-2">
                                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white font-bold text-xs">1</span>
                                    <h2 className="font-bold text-base tracking-wide">Paso 1: Configura la Tonalidad de Origen</h2>
                                </div>
                                <span className="text-xs text-slate-400">Piano Concierto $\rightarrow$ Saxo</span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                
                                <div>
                                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                                        🎹 Tonalidad del Piano / Concierto (C)
                                    </label>
                                    <div className="grid grid-cols-7 gap-1.5">
                                        {PIANO_KEYS.map((item) => {
                                            const isSelected = selectedPianoKey.key === item.key;
                                            return (
                                                <button
                                                    key={item.key}
                                                    onClick={() => setSelectedPianoKey(item)}
                                                    className={`py-2.5 rounded-lg text-sm font-bold transition flex flex-col items-center justify-center border ${
                                                        isSelected
                                                        ? 'bg-blue-600 text-white border-blue-500 shadow-md shadow-blue-500/20 scale-[1.02]'
                                                        : isDarkMode
                                                        ? 'bg-slate-800/80 border-slate-700 hover:bg-slate-700 text-slate-200'
                                                        : 'bg-slate-100 border-slate-200 hover:bg-slate-200 text-slate-800'
                                                    }`}
                                                >
                                                    <span>{item.key}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                                        🎷 Tipo de Saxofón
                                    </label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {SAXOPHONES.map((sax) => {
                                            const isSelected = selectedSax.id === sax.id;
                                            return (
                                                <button
                                                    key={sax.id}
                                                    onClick={() => setSelectedSax(sax)}
                                                    className={`p-3 rounded-xl border text-left transition flex flex-col justify-between ${
                                                        isSelected
                                                        ? 'bg-gradient-to-br from-amber-500 to-amber-600 text-slate-950 border-amber-400 font-bold shadow-lg shadow-amber-500/20 ring-2 ring-amber-400/50 scale-[1.02]'
                                                        : isDarkMode
                                                        ? 'bg-slate-800/80 border-slate-700 hover:bg-slate-700 text-slate-200'
                                                        : 'bg-slate-100 border-slate-200 hover:bg-slate-200 text-slate-800'
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between w-full mb-1">
                                                        <span className="text-xl">{sax.icon}</span>
                                                        <span className={`text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${
                                                            isSelected ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-700/50 text-amber-400'
                                                        }`}>
                                                            {sax.key}
                                                        </span>
                                                    </div>
                                                    <div>
                                                        <div className="text-sm font-bold leading-tight">{sax.name.replace('Saxo ', '')}</div>
                                                        <div className={`text-[11px] mt-0.5 ${isSelected ? 'text-slate-900' : 'text-slate-400'}`}>
                                                            Registro {sax.register}
                                                        </div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                            </div>
                        </section>

                        {/* RESULT BANNER & TUTORIAL TOGGLE */}
                        <section className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-amber-500 p-0.5 shadow-xl">
                            <div className={`p-6 rounded-[15px] ${isDarkMode ? 'bg-slate-950/90' : 'bg-white/95'} backdrop-blur-xl flex flex-col md:flex-row items-center justify-between gap-6`}>
                                
                                <div className="flex items-center space-x-4">
                                    <div className="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-500 text-3xl font-extrabold flex items-center justify-center min-w-[70px] min-h-[70px] shadow-inner">
                                        {transposedKeyName}
                                    </div>
                                    <div>
                                        <div className="text-xs uppercase font-bold tracking-wider text-amber-500">
                                            Tonalidad Resultante para {selectedSax.name}
                                        </div>
                                        <h3 className="text-2xl md:text-3xl font-black tracking-tight mt-0.5">
                                            {transposedKeyName} Mayor
                                        </h3>
                                        <p className="text-xs text-slate-400 mt-1">
                                            Piano Concierto en <span className="font-semibold text-blue-400">{selectedPianoKey.key}</span> ({selectedSax.desc})
                                        </p>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-start md:justify-end">
                                    <button
                                        onClick={() => setShowTutorial(!showTutorial)}
                                        className="px-4 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-2 shadow-md shadow-indigo-600/20"
                                    >
                                        <span>📚 {showTutorial ? 'Ocultar Tutorial' : 'Tutorial de Tonalidad'}</span>
                                    </button>

                                    <button
                                        onClick={handlePlayScale}
                                        disabled={isPlayingScale}
                                        className="px-4 py-2.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 transition flex items-center gap-2 shadow-md shadow-amber-500/20 disabled:opacity-50"
                                    >
                                        <span>{isPlayingScale ? '🔊 Reproduciendo...' : '▶ Escuchar Tonalidad'}</span>
                                    </button>
                                </div>

                            </div>
                        </section>

                        {/* TUTORIAL CARD */}
                        {showTutorial && (
                            <section className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-indigo-500/40 text-slate-200' : 'bg-indigo-50/50 border-indigo-200 text-slate-800'} shadow-lg`}>
                                <div className="flex items-center justify-between border-b border-indigo-500/20 pb-3 mb-4">
                                    <h3 className="text-base font-bold text-indigo-400 flex items-center gap-2">
                                        📖 Guía Tutorial: Interpretación en {transposedKeyName} para {selectedSax.name}
                                    </h3>
                                    <button 
                                        onClick={() => setShowTutorial(false)}
                                        className="text-xs font-bold text-slate-400 hover:text-slate-200"
                                    >
                                        ✕ Cerrar
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs leading-relaxed">
                                    <div className={`p-3.5 rounded-xl border ${isDarkMode ? 'bg-slate-950/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                                        <h4 className="font-extrabold text-amber-400 mb-1">1. Armadura de Clave en Saxo</h4>
                                        <p>
                                            Al tocar con el piano en <strong>{selectedPianoKey.key}</strong>, tu saxo leerá la tonalidad de <strong>{transposedKeyName}</strong>. 
                                            Mantén presente la alteración de notas accidentales en tu mapa de digitación.
                                        </p>
                                    </div>

                                    <div className={`p-3.5 rounded-xl border ${isDarkMode ? 'bg-slate-950/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                                        <h4 className="font-extrabold text-blue-400 mb-1">2. Consejos de Digitación</h4>
                                        <p>
                                            Practica el salto entre la <strong>Tónica ({activeNotes[0]?.noteName})</strong> y la <strong>Dominante ({activeNotes[4]?.noteName})</strong>. 
                                            Utiliza aire continuo para articular de forma homogénea las notas con llave de octava.
                                        </p>
                                    </div>

                                    <div className={`p-3.5 rounded-xl border ${isDarkMode ? 'bg-slate-950/60 border-slate-800' : 'bg-white border-slate-200'}`}>
                                        <h4 className="font-extrabold text-emerald-400 mb-1">3. Acompañamiento en Piano</h4>
                                        <p>
                                            El pianista acompañante debe tocar sobre la base de <strong>{selectedPianoKey.key} Mayor</strong>. 
                                            La progresión básica ii - V - I para piano en esta clave iniciará con el acorde relativo menor.
                                        </p>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* PASO 2: ESTRUCTURAS ARMÓNICAS */}
                        <section className={`p-5 rounded-2xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center space-x-2">
                                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-amber-500 text-slate-950 font-bold text-xs">2</span>
                                    <h2 className="font-bold text-base tracking-wide">Paso 2: Menú de Estructura Armónica</h2>
                                </div>
                                <span className="text-xs text-slate-400">Estructura activa</span>
                            </div>

                            <div className="flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
                                {STRUCTURES.map((struct) => {
                                    const isSelected = selectedStructure.id === struct.id;
                                    return (
                                        <button
                                            key={struct.id}
                                            onClick={() => {
                                                setSelectedStructure(struct);
                                                setSelectedNoteIndex(0);
                                            }}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border ${
                                                isSelected
                                                ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20'
                                                : isDarkMode
                                                ? 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
                                                : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'
                                            }`}
                                        >
                                            {struct.name}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* NOTES GRID WITH DEGREES */}
                            <div className="mt-6">
                                <div className="flex items-center justify-between mb-3">
                                    <h4 className="text-xs uppercase font-bold tracking-wider text-slate-400">
                                        Notas y Grados de la <span className="text-amber-400">{selectedStructure.name}</span> ({transposedKeyName})
                                    </h4>
                                    <span className="text-xs text-slate-400">Haz clic en una nota para ver digitación y teclado</span>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2.5">
                                    {activeNotes.map((note, idx) => {
                                        const isFocused = selectedNoteIndex === idx;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => {
                                                    setSelectedNoteIndex(idx);
                                                    playInstrumentPitch(note.frequency, 0.5, soundEngine, selectedSax.id);
                                                }}
                                                className={`p-3.5 rounded-xl border flex flex-col items-center justify-between transition hover:scale-[1.03] active:scale-95 ${
                                                    isFocused
                                                    ? 'bg-gradient-to-b from-amber-500 to-amber-600 border-amber-300 text-slate-950 shadow-lg shadow-amber-500/30 ring-2 ring-amber-400 font-bold'
                                                    : isDarkMode
                                                    ? 'bg-slate-800/90 border-slate-700 text-slate-100 hover:border-amber-500/50'
                                                    : 'bg-slate-50 border-slate-200 text-slate-800 hover:border-amber-500/50'
                                                }`}
                                            >
                                                <div className="flex items-center justify-between w-full">
                                                    <span className={`text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded ${
                                                        isFocused ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-700/40 text-amber-400'
                                                    }`}>
                                                        {note.degree}
                                                    </span>
                                                </div>

                                                <span className="text-2xl font-black my-1 tracking-tight">
                                                    {note.noteName}
                                                </span>

                                                <span className={`text-[10px] font-bold text-center leading-tight truncate w-full ${
                                                    isFocused ? 'text-slate-950' : 'text-amber-400/90'
                                                }`}>
                                                    {note.degreeName}
                                                </span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                        </section>

                        {/* VISUALIZADORES DUALES: TECLADO Y LLAVES DEL SAXOFÓN */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            
                            {/* PIANO KEYBOARD */}
                            <section className={`md:col-span-2 p-5 rounded-2xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <div className="flex items-center justify-between mb-4">
                                    <div>
                                        <h3 className="font-bold text-base tracking-wide flex items-center gap-2">
                                            🎹 Teclado Visualizador
                                        </h3>
                                        <p className="text-xs text-slate-400">Resaltado de notas en el piano de referencia</p>
                                    </div>
                                    <div className="flex items-center space-x-3 text-xs">
                                        <span className="flex items-center gap-1">
                                            <span className="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                                            <span className="text-slate-400">Seleccionada</span>
                                        </span>
                                        <span className="flex items-center gap-1">
                                            <span className="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                                            <span className="text-slate-400">Escala</span>
                                        </span>
                                    </div>
                                </div>

                                <div className="relative w-full overflow-x-auto pb-2">
                                    <div className="flex min-w-[520px] h-36 bg-slate-950 p-2 rounded-xl border border-slate-800 relative justify-center">
                                        {Array.from({ length: 24 }).map((_, keyIdx) => {
                                            const pitchClass = keyIdx % 12;
                                            const isBlack = [1, 3, 6, 8, 10].includes(pitchClass);
                                            const noteObj = activeNotes.find(n => n.pitchClass === pitchClass);
                                            const isFocused = activeSelectedNote && activeSelectedNote.pitchClass === pitchClass;
                                            const isScaleNote = !!noteObj;

                                            if (isBlack) return null;

                                            return (
                                                <div
                                                    key={keyIdx}
                                                    onClick={() => {
                                                        const matchedIdx = activeNotes.findIndex(n => n.pitchClass === pitchClass);
                                                        if (matchedIdx !== -1) setSelectedNoteIndex(matchedIdx);
                                                        playInstrumentPitch(getPitchFrequency(pitchClass, keyIdx < 12 ? 4 : 5), 0.5, soundEngine, selectedSax.id);
                                                    }}
                                                    className={`relative flex-1 min-w-[28px] max-w-[40px] h-full rounded-b-md border transition-all cursor-pointer flex flex-col justify-end items-center pb-2 select-none ${
                                                        isFocused
                                                        ? 'bg-amber-400 border-amber-300 text-slate-950 font-bold shadow-lg shadow-amber-500/40 z-10 scale-[1.02]'
                                                        : isScaleNote
                                                        ? 'bg-blue-500 border-blue-400 text-white font-bold z-10'
                                                        : 'bg-white border-slate-300 hover:bg-slate-100 text-slate-700'
                                                    }`}
                                                >
                                                    {[1, 3, 6, 8, 10].includes((pitchClass + 1) % 12) && (
                                                        <div
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                const blackPitch = (pitchClass + 1) % 12;
                                                                const matchedIdx = activeNotes.findIndex(n => n.pitchClass === blackPitch);
                                                                if (matchedIdx !== -1) setSelectedNoteIndex(matchedIdx);
                                                                playInstrumentPitch(getPitchFrequency(blackPitch, keyIdx < 12 ? 4 : 5), 0.5, soundEngine, selectedSax.id);
                                                            }}
                                                            className={`absolute top-0 -right-[40%] w-[80%] h-[60%] rounded-b-md border z-20 cursor-pointer flex items-end justify-center pb-1 transition ${
                                                                activeSelectedNote && activeSelectedNote.pitchClass === ((pitchClass + 1) % 12)
                                                                ? 'bg-amber-400 border-amber-300 text-slate-950 font-bold shadow-lg'
                                                                : activeNotes.some(n => n.pitchClass === ((pitchClass + 1) % 12))
                                                                ? 'bg-blue-500 border-blue-400 text-white font-bold'
                                                                : 'bg-slate-900 border-slate-800 hover:bg-slate-800 text-slate-300'
                                                            }`}
                                                        >
                                                            <span className="text-[9px]">
                                                                {getPitchName((pitchClass + 1) % 12, transposedKeyName)}
                                                            </span>
                                                        </div>
                                                    )}

                                                    <span className="text-xs font-bold">
                                                        {getPitchName(pitchClass, transposedKeyName)}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </section>

                            {/* SAXOPHONE KEYS DIAGRAM */}
                            <section className="md:col-span-1">
                                <SaxophoneKeysDiagram 
                                    pitchClass={activeSelectedNote.pitchClass}
                                    noteName={activeSelectedNote.noteName}
                                    isDarkMode={isDarkMode}
                                />
                            </section>

                        </div>

                        {/* COMPARATIVE SUMMARY */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            <div className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <h3 className="font-bold text-sm tracking-wide mb-3 flex items-center gap-2">
                                    🔄 Comparativa Directa Concierto vs Saxofón
                                </h3>
                                <div className="space-y-2">
                                    <div className={`p-3 rounded-xl border flex items-center justify-between text-xs ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                        <span className="font-semibold text-blue-400">🎹 Piano (Concierto):</span>
                                        <span className="font-mono font-bold tracking-wider text-sm">
                                            {pianoConcertNotes.map(n => n.noteName).join(' - ')}
                                        </span>
                                    </div>
                                    <div className={`p-3 rounded-xl border flex items-center justify-between text-xs ${isDarkMode ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                                        <span className="font-semibold text-amber-400">🎷 {selectedSax.name}:</span>
                                        <span className="font-mono font-bold tracking-wider text-sm">
                                            {activeNotes.map(n => n.noteName).join(' - ')}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className={`p-5 rounded-2xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <h3 className="font-bold text-sm tracking-wide mb-2 flex items-center gap-2">
                                    💡 Regla Didáctica de Transposición
                                </h3>
                                <div className="text-xs space-y-2 text-slate-400 leading-relaxed">
                                    <p>
                                        <strong className="text-slate-200">Saxo Alto (Eb):</strong> Lees <span className="text-amber-400 font-bold">9 semitonos arriba (Sexta Mayor)</span>. Ejemplo: Piano en C $\rightarrow$ Saxo Alto toca A.
                                    </p>
                                    <p>
                                        <strong className="text-slate-200">Saxo Soprano / Tenor (Bb):</strong> Lees <span className="text-amber-400 font-bold">2 semitonos arriba (Un Tono)</span>. Ejemplo: Piano en C $\rightarrow$ Saxo Tenor/Soprano toca D.
                                    </p>
                                </div>
                            </div>

                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="max-w-5xl mx-auto px-4 mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
                        Plataforma interactiva de transposición para saxofonistas, pianistas y arreglistas.
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
