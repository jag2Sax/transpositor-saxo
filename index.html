<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transpositor & Escalas - Piano y Saxofón</title>
    <!-- Tailwind CSS CDN -->
    <!-- Custom Key Glow & Animations -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom Key Glow */
        .key-active {
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
        }

        @keyframes greenBlink {
            0%, 100% {
                fill: rgba(34, 197, 94, 0.55);
                stroke: #22c55e;
                stroke-width: 2.5px;
                filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.9));
            }
            50% {
                fill: rgba(34, 197, 94, 0.18);
                stroke: #16a34a;
                stroke-width: 1.5px;
                filter: drop-shadow(0 0 2px rgba(34, 197, 94, 0.3));
            }
        }
        .sax-key-active {
            animation: greenBlink 1.1s infinite ease-in-out;
        }
        .sax-key-inactive {
            fill: #334155;
            stroke: #64748b;
            stroke-width: 1.5px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">

        // Pitch classes in chromatic sequence
        const CHROMATIC_PITCHES = [
            { id: 0, defaultName: 'C', altName: 'C' },
            { id: 1, defaultName: 'C#', altName: 'Db' },
            { id: 2, defaultName: 'D', altName: 'D' },
            { id: 3, defaultName: 'Eb', altName: 'D#' },
            { id: 4, defaultName: 'E', altName: 'E' },
            { id: 5, defaultName: 'F', altName: 'F' },
            { id: 6, defaultName: 'F#', altName: 'Gb' },
            { id: 7, defaultName: 'G', altName: 'G' },
            { id: 8, defaultName: 'Ab', altName: 'G#' },
            { id: 9, defaultName: 'A', altName: 'A' },
            { id: 10, defaultName: 'Bb', altName: 'A#' },
            { id: 11, defaultName: 'B', altName: 'B' }
        ];

        // Piano Key Options (Concert Pitch)
        const PIANO_KEYS = [
            { key: 'C', pitch: 0, type: 'natural' },
            { key: 'C#', pitch: 1, type: 'sharp' },
            { key: 'Db', pitch: 1, type: 'flat' },
            { key: 'D', pitch: 2, type: 'natural' },
            { key: 'Eb', pitch: 3, type: 'flat' },
            { key: 'E', pitch: 4, type: 'natural' },
            { key: 'F', pitch: 5, type: 'natural' },
            { key: 'F#', pitch: 6, type: 'sharp' },
            { key: 'Gb', pitch: 6, type: 'flat' },
            { key: 'G', pitch: 7, type: 'natural' },
            { key: 'Ab', pitch: 8, type: 'flat' },
            { key: 'A', pitch: 9, type: 'natural' },
            { key: 'Bb', pitch: 10, type: 'flat' },
            { key: 'B', pitch: 11, type: 'natural' }
        ];

        // Saxophone definitions
        const SAXOPHONES = [
            {
                id: 'soprano',
                name: 'Saxo Soprano',
                key: 'Bb',
                offset: 2, // Major 2nd up
                desc: 'Transposición en Bb (+1 Tono arriba)',
                icon: '🎷',
                register: 'Agudo'
            },
            {
                id: 'alto',
                name: 'Saxo Alto',
                key: 'Eb',
                offset: 9, // Major 6th up (+9 semitones pitch class)
                desc: 'Transposición en Eb (+6ta Mayor / -3 semitonos)',
                icon: '🎷',
                register: 'Medio'
            },
            {
                id: 'tenor',
                name: 'Saxo Tenor',
                key: 'Bb',
                offset: 2, // Pitch class +2
                desc: 'Transposición en Bb (+1 Tono arriba octava baja)',
                icon: '🎷',
                register: 'Grave'
            }
        ];

        // Scale degree names mapping dictionary
        const DEGREE_NAMES = {
            '1': 'Tónica',
            '2': 'Supertónica',
            'b3': 'Mediante Menor',
            '3': 'Mediante',
            '4': 'Subdominante',
            'b5': 'Tritono / 5ta Disminuida',
            '5': 'Dominante',
            'b6': 'Superdominante Menor',
            '6': 'Superdominante',
            'b7': 'Subtónica',
            '7': 'Sensible'
        };

        // Harmonic Structures and Interval definitions
        const STRUCTURES = [
            {
                id: 'major_scale',
                category: 'Escalas',
                name: 'Escala Mayor (Natural)',
                intervals: [0, 2, 4, 5, 7, 9, 11],
                degrees: ['1', '2', '3', '4', '5', '6', '7']
            },
            {
                id: 'triad_major',
                category: 'Triadas',
                name: 'Triada Mayor',
                intervals: [0, 4, 7],
                degrees: ['1', '3', '5']
            },
            {
                id: 'triad_minor',
                category: 'Triadas',
                name: 'Triada Menor',
                intervals: [0, 3, 7],
                degrees: ['1', 'b3', '5']
            },
            {
                id: 'pentatonic_major',
                category: 'Pentatónicas',
                name: 'Pentatónica Mayor',
                intervals: [0, 2, 4, 7, 9],
                degrees: ['1', '2', '3', '5', '6']
            },
            {
                id: 'pentatonic_minor',
                category: 'Pentatónicas',
                name: 'Pentatónica Menor',
                intervals: [0, 3, 5, 7, 10],
                degrees: ['1', 'b3', '4', '5', 'b7']
            },
            {
                id: 'blues_scale',
                category: 'Blues',
                name: 'Escala de Blues',
                intervals: [0, 3, 5, 6, 7, 10],
                degrees: ['1', 'b3', '4', 'b5', '5', 'b7']
            },
            {
                id: 'harmonic_minor',
                category: 'Menores',
                name: 'Menor Armónica',
                intervals: [0, 2, 3, 5, 7, 8, 11],
                degrees: ['1', '2', 'b3', '4', '5', 'b6', '7']
            },
            {
                id: 'melodic_minor',
                category: 'Menores',
                name: 'Menor Melódica',
                intervals: [0, 2, 3, 5, 7, 9, 11],
                degrees: ['1', '2', 'b3', '4', '5', '6', '7']
            },
            {
                id: 'dom_7',
                category: 'Acordes 7ma',
                name: '7ma Dominante',
                intervals: [0, 4, 7, 10],
                degrees: ['1', '3', '5', 'b7']
            },
            {
                id: 'maj_7',
                category: 'Acordes 7ma',
                name: '7ma Mayor (Maj7)',
                intervals: [0, 4, 7, 11],
                degrees: ['1', '3', '5', '7']
            }
        ];

        // Standard Saxophone Fingerings database for pitch classes 0..11
        // Keys: ok=Octave, lh1=Left index, lh2=Left middle, lh3=Left ring, rh1=Right index, rh2=Right middle, rh3=Right ring, bis=Bis Bb, gis=G#, eb=Low Eb, c=Low C
        const SAX_FINGERINGS = {
            0: { name: 'C', keys: { lh2: true, c: true } }, // C
            1: { name: 'C# / Db', keys: { open: true } }, // C# (all main keys open)
            2: { name: 'D', keys: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true } }, // D
            3: { name: 'Eb / D#', keys: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true, rh3: true, eb: true } }, // Eb
            4: { name: 'E', keys: { lh1: true, lh2: true, lh3: true, rh1: true, rh2: true } }, // E
            5: { name: 'F', keys: { lh1: true, lh2: true, lh3: true, rh1: true } }, // F
            6: { name: 'F# / Gb', keys: { lh1: true, lh2: true, lh3: true, rh2: true } }, // F#
            7: { name: 'G', keys: { lh1: true, lh2: true, lh3: true } }, // G
            8: { name: 'G# / Ab', keys: { lh1: true, lh2: true, lh3: true, gis: true } }, // G#
            9: { name: 'A', keys: { lh1: true, lh2: true } }, // A
            10: { name: 'Bb / A#', keys: { lh1: true, bis: true } }, // Bb (Bis fingering)
            11: { name: 'B', keys: { lh1: true } } // B
        };


        let audioCtx = null;

        // Multi-Instrument Web Audio Synthesizer
        function playInstrumentPitch(frequency, duration = 0.6, soundMode = 'piano', saxType = 'alto') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (soundMode === 'piano') {
                    // Grand Piano Synthesis (Dual Oscillator + Decay + Body Filter)
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    osc1.type = 'triangle';
                    osc2.type = 'sine';

                    osc1.frequency.setValueAtTime(frequency, now);
                    osc2.frequency.setValueAtTime(frequency * 2, now); // 1st harmonic overtone

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1800, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + duration);

                    gainNode.gain.setValueAtTime(0.001, now);
                    gainNode.gain.linearRampToValueAtTime(0.5, now + 0.02); // Percussive strike
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc1.connect(filter);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + duration);
                    osc2.stop(now + duration);

                } else if (soundMode === 'sax') {
                    // Realistic Saxophone Timbre Synthesis (Sawtooth + Formant Filter + Vibrato)
                    const osc = audioCtx.createOscillator();
                    const subOsc = audioCtx.createOscillator();
                    const vibrato = audioCtx.createOscillator();
                    const vibratoGain = audioCtx.createGain();
                    const gainNode = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    // Formant tuning based on saxophone type
                    let filterCutoff = 1400;
                    if (saxType === 'soprano') filterCutoff = 2200;
                    if (saxType === 'tenor') filterCutoff = 950;

                    osc.type = 'sawtooth';
                    subOsc.type = 'square';

                    osc.frequency.setValueAtTime(frequency, now);
                    subOsc.frequency.setValueAtTime(frequency * 0.5, now);

                    // Subtle Vibrato
                    vibrato.frequency.setValueAtTime(5.2, now); // 5 Hz vibrato rate
                    vibratoGain.gain.setValueAtTime(frequency * 0.015, now); // vibrato depth
                    vibrato.connect(osc.frequency);

                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(filterCutoff, now);
                    filter.Q.setValueAtTime(1.8, now);

                    // Expressive reed envelope: swelling attack, warm sustain
                    gainNode.gain.setValueAtTime(0.001, now);
                    gainNode.gain.linearRampToValueAtTime(0.35, now + 0.08); // Reed swell
                    gainNode.gain.setValueAtTime(0.35, now + duration - 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    osc.connect(filter);
                    subOsc.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    vibrato.start(now);
                    osc.start(now);
                    subOsc.start(now);

                    vibrato.stop(now + duration);
                    osc.stop(now + duration);
                    subOsc.stop(now + duration);

                } else {
                    // Pure Harmonic Tone
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(frequency, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                }
            } catch (e) {
                console.error('Audio Synthesis Error:', e);
            }
        }

        // Calculate frequency from pitch class
        function getPitchFrequency(pitchClass, octave = 4) {
            const midiNote = (octave + 1) * 12 + pitchClass;
            return 440 * Math.pow(2, (midiNote - 69) / 12);
        }

        // Pitch transposition calculator
        function getTransposedPitch(concertPitch, offsetSemis) {
            return (concertPitch + offsetSemis) % 12;
        }

        // Preferred spellings dictionary
        const PREFERRED_SPELLINGS = {
            'C':  ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G':  ['G', 'A', 'B', 'C', 'D', 'E', 'F#'],
            'D':  ['D', 'E', 'F#', 'G', 'A', 'B', 'C#'],
            'A':  ['A', 'B', 'C#', 'D', 'E', 'F#', 'G#'],
            'E':  ['E', 'F#', 'G#', 'A', 'B', 'C#', 'D#'],
            'B':  ['B', 'C#', 'D#', 'E', 'F#', 'G#', 'A#'],
            'F#': ['F#', 'G#', 'A#', 'B', 'C#', 'D#', 'E#'],
            'F':  ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C'],
            'Gb': ['Gb', 'Ab', 'Bb', 'Cb', 'Db', 'Eb', 'F'],
            'C#': ['C#', 'D#', 'E#', 'F#', 'G#', 'A#', 'B#']
        };

        function getPitchName(pitchClass, keyContext = 'C') {
            const preferFlats = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(keyContext);
            const pitch = CHROMATIC_PITCHES.find(p => p.id === pitchClass);
            if (!pitch) return '?';
            return preferFlats ? (pitch.altName.includes('b') ? pitch.altName : pitch.defaultName) : pitch.defaultName;
        }

        // Generate full note detail objects
        function generateStructureNotes(rootPitchClass, rootKeyName, structure) {
            return structure.intervals.map((interval, idx) => {
                const pitchClass = (rootPitchClass + interval) % 12;
                let noteName = getPitchName(pitchClass, rootKeyName);

                if (PREFERRED_SPELLINGS[rootKeyName] && structure.intervals.length === 7) {
                    noteName = PREFERRED_SPELLINGS[rootKeyName][idx] || noteName;
                }

                const degreeCode = structure.degrees[idx] || '';
                const degreeName = DEGREE_NAMES[degreeCode] || `Grado ${idx + 1}`;

                return {
                    pitchClass,
                    noteName,
                    degree: degreeCode,
                    degreeName,
                    interval,
                    frequency: getPitchFrequency(pitchClass, interval < 0 ? 3 : 4)
                };
            });
        }

        // Interactive Realistic Saxophone Key Fingering Visualizer Component
        function SaxophoneKeysDiagram({ pitchClass, noteName, isDarkMode }) {
            const fingering = SAX_FINGERINGS[pitchClass] || { keys: {} };
            const k = fingering.keys;

            // Helper to get key CSS class
            const getKeyClass = (isActive) => isActive ? 'sax-key-active' : 'sax-key-inactive';

            return (
                <div className={`p-4 rounded-xl border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'} flex flex-col items-center justify-center`}>
                    <div className="flex items-center justify-between w-full mb-3">
                        <span className="text-xs uppercase font-extrabold tracking-wider text-amber-500 flex items-center gap-1.5">
                            <span>🎷 Digitación en Saxofón:</span>
                            <span className="text-base text-emerald-400 font-black">{noteName}</span>
                        </span>
                        {k.open && (
                            <span className="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">
                                Abiertas
                            </span>
                        )}
                    </div>

                    {/* Detailed Vector Graphic Saxophone Simulation */}
                    <div className="relative w-full max-w-[260px] bg-slate-950/90 rounded-2xl border border-amber-500/30 p-2 flex flex-col items-center shadow-2xl">
                        
                        <svg viewBox="0 0 240 500" className="w-full h-auto max-h-[440px]">
                            <defs>
                                <linearGradient id="saxBrass" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#f59e0b" />
                                    <stop offset="50%" stopColor="#d97706" />
                                    <stop offset="100%" stopColor="#78350f" />
                                </linearGradient>
                                <linearGradient id="saxBell" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#fbbf24" />
                                    <stop offset="70%" stopColor="#b45309" />
                                    <stop offset="100%" stopColor="#451a03" />
                                </linearGradient>
                            </defs>

                            {/* Saxophone Body Outline / Tube Path */}
                            {/* Neck / Tudel */}
                            <path d="M 115 15 L 115 35 Q 115 55 105 65 L 95 75" fill="none" stroke="url(#saxBrass)" strokeWidth="12" strokeLinecap="round" />
                            <rect x="110" y="8" width="10" height="12" rx="2" fill="#78350f" stroke="#fbbf24" strokeWidth="1" /> {/* Boquilla */}

                            {/* Main Body Tube */}
                            <path d="M 95 75 L 95 360" fill="none" stroke="url(#saxBrass)" strokeWidth="26" strokeLinecap="round" />
                            
                            {/* Bow & Bell Flare (Codo y Campana) */}
                            <path d="M 95 355 C 95 450 170 450 175 350 L 180 270" fill="none" stroke="url(#saxBrass)" strokeWidth="28" strokeLinecap="round" />
                            {/* Bell Flare Opening */}
                            <ellipse cx="185" cy="260" rx="28" ry="18" fill="url(#saxBell)" stroke="#fbbf24" strokeWidth="3" />

                            {/* Key Guard Wire Detailing */}
                            <path d="M 112 120 L 112 370" stroke="#92400e" strokeWidth="3" fill="none" />

                            {/* ================= SAXOPHONE KEYS & DIGITATION ================= */}

                            {/* OCTAVE KEY (Behind Neck) */}
                            <g>
                                <circle cx="120" cy="45" r="7" className={getKeyClass(k.ok)} />
                                <text x="132" y="48" fill="#94a3b8" fontSize="9" fontWeight="bold">OCT</text>
                            </g>

                            {/* MANO IZQUIERDA (Left Hand Stack) */}
                            {/* LH Key 1 */}
                            <g>
                                <circle cx="95" cy="120" r="11" className={getKeyClass(k.lh1)} />
                                <text x="95" y="124" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">1</text>
                                <text x="65" y="124" fill="#cbd5e1" fontSize="9" fontWeight="bold">M. Izq 1</text>
                            </g>

                            {/* Bis Bb Key */}
                            <g>
                                <circle cx="108" cy="140" r="6" className={getKeyClass(k.bis)} />
                                <text x="118" y="143" fill="#fbbf24" fontSize="8" fontWeight="bold">Bis (Bb)</text>
                            </g>

                            {/* LH Key 2 */}
                            <g>
                                <circle cx="95" cy="158" r="11" className={getKeyClass(k.lh2)} />
                                <text x="95" y="162" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">2</text>
                                <text x="65" y="162" fill="#cbd5e1" fontSize="9" fontWeight="bold">M. Izq 2</text>
                            </g>

                            {/* LH Key 3 */}
                            <g>
                                <circle cx="95" cy="195" r="11" className={getKeyClass(k.lh3)} />
                                <text x="95" y="199" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">3</text>
                                <text x="65" y="199" fill="#cbd5e1" fontSize="9" fontWeight="bold">M. Izq 3</text>
                            </g>

                            {/* G# / Sol# Key (Pinky) */}
                            <g>
                                <rect x="112" y="212" width="22" height="12" rx="4" className={getKeyClass(k.gis)} />
                                <text x="115" y="221" fill="#ffffff" fontSize="8" fontWeight="bold">G#</text>
                            </g>


                            {/* SEPARATOR / STACK DIVIDER */}
                            <line x1="75" y1="235" x2="115" y2="235" stroke="#475569" strokeWidth="2" strokeDasharray="3 3" />


                            {/* MANO DERECHA (Right Hand Stack) */}
                            {/* RH Key 1 */}
                            <g>
                                <circle cx="95" cy="265" r="11" className={getKeyClass(k.rh1)} />
                                <text x="95" y="269" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">1</text>
                                <text x="65" y="269" fill="#cbd5e1" fontSize="9" fontWeight="bold">M. Der 1</text>
                            </g>

                            {/* RH Key 2 */}
                            <g>
                                <circle cx="95" cy="302" r="11" className={getKeyClass(k.rh2)} />
                                <text x="95" y="306" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">2</text>
                                <text x="65" y="306" fill="#cbd5e1" fontSize="9" fontWeight="bold">M. Der 2</text>
                            </g>

                            {/* RH Key 3 */}
                            <g>
                                <circle cx="95" cy="340" r="11" className={getKeyClass(k.rh3)} />
                                <text x="95" y="344" fill="#ffffff" fontSize="11" fontWeight="bold" textAnchor="middle">3</text>
                                <text x="65" y="344" fill="#cbd5e1" fontSize="9" fontWeight="bold">M. Der 3</text>
                            </g>

                            {/* LOW PINKY KEYS (Eb & C) */}
                            <g>
                                <rect x="112" y="355" width="20" height="12" rx="4" className={getKeyClass(k.eb)} />
                                <text x="115" y="364" fill="#ffffff" fontSize="8" fontWeight="bold">Eb</text>
                            </g>
                            <g>
                                <rect x="112" y="372" width="20" height="12" rx="4" className={getKeyClass(k.c)} />
                                <text x="117" y="381" fill="#ffffff" fontSize="8" fontWeight="bold">C</text>
