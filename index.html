    function normalizeNote(note) {
      if (!note) return 'C';
      const clean = note.replace('m', '').trim();

    }

    function transposeNote(note, semitones) {
      const baseNote = normalizeNote(note);
      const idx = CHROMATIC_SCALE.indexOf(baseNote);
      if (idx === -1) return note;
      let targetIdx = (idx + semitones) % 12;
      if (targetIdx < 0) targetIdx += 12;
      return CHROMATIC_SCALE[targetIdx];
    }

    function getFingeringData(noteName, octaveChoice = 2, isAlt = false) {
      const clean = normalizeNote(noteName);
      const noteEntry = SAX_FINGERINGS_MAP[clean] || SAX_FINGERINGS_MAP['C'];
      const octaveKey = octaveChoice === 1 ? 'octave1' : (octaveChoice === 3 ? 'octave3' : 'octave2');
      const octaveData = noteEntry[octaveKey] || noteEntry['octave2'] || noteEntry['octave1'];
      const fingering = isAlt && octaveData.alt ? octaveData.alt : octaveData.standard;
      const hasAltOption = !!octaveData.alt;
      return { fingering, hasAltOption };
    }

    // --- SINTETIZADOR DE SONIDO ---
    class InstrumentSynth {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      getFrequency(noteName, octave = 4) {
        const clean = normalizeNote(noteName);
        const semitoneFromC = CHROMATIC_SCALE.indexOf(clean);
        if (semitoneFromC === -1) return 440;
        const midi = 60 + semitoneFromC + (octave - 4) * 12;
        return 440 * Math.pow(2, (midi - 69) / 12);
      }
      playNote(noteName, type = 'piano', octave = 4, duration = 0.8) {
        this.init();
        if (!this.ctx) return;
        const freq = this.getFrequency(noteName, octave);
        const now = this.ctx.currentTime;

        if (type === 'piano') {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc1.type = 'triangle'; osc2.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.7, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc1.connect(gain); osc2.connect(gain);
          gain.connect(this.ctx.destination);
          osc1.start(now); osc2.start(now);
          osc1.stop(now + duration); osc2.stop(now + duration);
        } else {
          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();
          const lfo = this.ctx.createOscillator();
          osc.type = 'sawtooth'; subOsc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          subOsc.frequency.setValueAtTime(freq, now);
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(freq * 1.8, now);
          filter.Q.setValueAtTime(2.5, now);
          lfo.frequency.setValueAtTime(5.2, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.5, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(filter); subOsc.connect(filter);
          filter.connect(gain); gain.connect(this.ctx.destination);
          lfo.start(now); osc.start(now); subOsc.start(now);
          lfo.stop(now + duration); osc.stop(now + duration); subOsc.stop(now + duration);
        }
      }
    }
    const synth = new InstrumentSynth();

    // --- PENTAGRAMA ---
    function TrebleClefStaff({ notes, activeNoteIndex, onSelectNote }) {
      const STAFF_Y_MAP = {
        'C': 85, 'C#': 85, 'Db': 85,
        'D': 77.5, 'Eb': 70, 'E': 70,
        'F': 62.5, 'F#': 62.5, 'G': 55,
        'Ab': 47.5, 'A': 47.5, 'Bb': 40, 'B': 40
      };

      return (
        <div className="w-full bg-slate-950 p-4 rounded-2xl border border-slate-800 shadow-inner overflow-x-auto">
          <svg viewBox="0 0 500 120" className="w-full h-32 min-w-[400px]">
            <line x1="20" y1="30" x2="480" y2="30" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="40" x2="480" y2="40" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="50" x2="480" y2="50" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="60" x2="480" y2="60" stroke="#475569" strokeWidth="1.5" />
            <line x1="20" y1="70" x2="480" y2="70" stroke="#475569" strokeWidth="1.5" />

            <text x="25" y="68" fill="#f59e0b" fontSize="48" fontFamily="serif" fontWeight="bold">𝄞</text>

            {notes.map((noteObj, idx) => {
              const clean = normalizeNote(noteObj.note);
              const isAccidental = noteObj.note.includes('#') || noteObj.note.includes('b') || noteObj.note.includes('♭');
              const accidentalSymbol = noteObj.note.includes('#') ? '♯' : (isAccidental ? '♭' : '');
              
              const xPos = 90 + idx * (360 / Math.max(notes.length - 1, 1));
              const yPos = STAFF_Y_MAP[clean] || 55;
              const isActive = activeNoteIndex === idx;

              return (
                <g key={idx} className="cursor-pointer group" onClick={() => onSelectNote(idx)}>
                  {yPos >= 85 && (
                    <line x1={xPos - 12} y1="85" x2={xPos + 12} y2="85" stroke="#f59e0b" strokeWidth="1.5" />
                  )}

                  {accidentalSymbol && (
                    <text x={xPos - 14} y={yPos + 4} fill={isActive ? '#38bdf8' : '#94a3b8'} fontSize="14" fontWeight="bold">
                      {accidentalSymbol}
                    </text>
                  )}

                  <ellipse 
                    cx={xPos} 
                    cy={yPos} 
                    rx="7" 
                    ry="5" 
                    fill={isActive ? '#38bdf8' : '#f59e0b'}
                    transform={`rotate(-20 ${xPos} ${yPos})`}
                    className="transition-all duration-200 group-hover:scale-125"
                  />

                  <line 
                    x1={xPos + 6} 
                    y1={yPos} 
                    x2={xPos + 6} 
                    y2={yPos - 28} 
                    stroke={isActive ? '#38bdf8' : '#cbd5e1'} 
                    strokeWidth="1.5" 
                  />

                  <text 
                    x={xPos} 
                    y="110" 
                    textAnchor="middle" 
                    fill={isActive ? '#38bdf8' : '#f8fafc'} 
                    fontSize="12" 
                    fontWeight="bold"
                  >
                    {noteObj.note}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

      const [direction, setDirection] = useState('piano-to-sax');
      const [modeQuality, setModeQuality] = useState('Mayor');
      const [soundType, setSoundType] = useState('sax');
      const [selectedKey, setSelectedKey] = useState('Eb');
      const [selectedSax, setSelectedSax] = useState('Alto');
      const [selectedStructure, setSelectedStructure] = useState('Menor Natural');
      const [activeNoteIdx, setActiveNoteIdx] = useState(0);

      const [octaveChoice, setOctaveChoice] = useState(2);
      const [isAlt, setIsAlt] = useState(false);

      const [isTableOpen, setIsTableOpen] = useState(false);
      const [isGeminiOpen, setIsGeminiOpen] = useState(false);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [isUsersOpen, setIsUsersOpen] = useState(false);

      // Verificación estricta del Administrador
      const isAdmin = useMemo(() => {
        if (!user || !user.email) return false;
        return user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      }, [user]);

      // Control de inicio de sesión y guardado en Firestore
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            setIsAuthOpen(false);
            try {
              const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.uid);
              await setDoc(userRef, {
                uid: currentUser.uid,
                email: currentUser.email || 'Anónimo',
                name: currentUser.displayName || currentUser.email?.split('@')[0] || 'Saxofonista',
                photoURL: currentUser.photoURL || null,
                provider: currentUser.providerData[0]?.providerId || 'password',
                lastLogin: new Date().toISOString()
              }, { merge: true });
            } catch (err) {
              console.warn("Aviso guardando usuario en Firestore:", err);
            }
          } else {
            setIsAuthOpen(true);
          }
        });
        return () => unsubscribe();
      }, []);

      // Escucha la lista de usuarios solo si el usuario es Administrador
      useEffect(() => {
        if (!user || !isAdmin) return;
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const unsubscribe = onSnapshot(usersCol, (snapshot) => {
          const list = [];
          snapshot.forEach((d) => list.push(d.data()));
          setUsersList(list);
        }, (err) => console.warn("Aviso escuchando Firestore:", err));

        return () => unsubscribe();
      }, [user, isAdmin]);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const transposedResultKey = useMemo(() => {
        const offset = TRANSPOSE_OFFSETS[selectedSax] || 2;
        const actualOffset = direction === 'piano-to-sax' ? offset : (12 - offset);
        const transposed = transposeNote(selectedKey, actualOffset);
        return modeQuality === 'Menor' ? `${transposed}m` : transposed;
      }, [selectedKey, selectedSax, direction, modeQuality]);

      const relativeKeyInfo = useMemo(() => {
        if (modeQuality === 'Mayor') {
          const relMinor = transposeNote(selectedKey, -3);
          return { label: 'Relativa Menor', key: `${relMinor}m`, note: relMinor, mode: 'Menor' };
        } else {
          const relMajor = transposeNote(selectedKey, 3);
          return { label: 'Relativa Mayor', key: relMajor, note: relMajor, mode: 'Mayor' };
        }
      }, [selectedKey, modeQuality]);

      const activeStructureNotes = useMemo(() => {
        const rootNote = normalizeNote(transposedResultKey);
        const template = STRUCTURE_TEMPLATES[selectedStructure] || STRUCTURE_TEMPLATES['Mayor Natural'];
        const rootIdx = CHROMATIC_SCALE.indexOf(rootNote);
        const isMinorMode = modeQuality === 'Menor' || selectedStructure.includes('Menor');

        return template.intervals.map((semitones, idx) => {
          const noteIdx = (rootIdx + semitones) % 12;
          const noteName = CHROMATIC_SCALE[noteIdx];
          let degName = template.names ? template.names[idx] : (isMinorMode ? DEGREE_NAMES_MINOR[idx] : DEGREE_NAMES_MAJOR[idx]);
          return { note: noteName, degreeName: degName || `Grado ${idx + 1}` };
        });
      }, [transposedResultKey, selectedStructure, modeQuality]);

      const currentActiveNote = activeStructureNotes[activeNoteIdx]?.note || 'C';
      const { fingering, hasAltOption } = getFingeringData(currentActiveNote, octaveChoice, isAlt);

      const handlePlayScale = () => {
        activeStructureNotes.forEach((noteObj, idx) => {
          setTimeout(() => {
            setActiveNoteIdx(idx);
            synth.playNote(noteObj.note, soundType, idx >= 4 ? 5 : 4, 0.6);
          }, idx * 400);
        });
      };

      const handleSelectNote = (idx) => {
        setActiveNoteIdx(idx);
        const note = activeStructureNotes[idx].note;
        synth.playNote(note, soundType, idx >= 4 ? 5 : 4, 0.8);
      };

      const handleSelectFromTable = (note, mode) => {
        setSelectedKey(normalizeNote(note));
        setModeQuality(mode);
        setSelectedStructure(mode === 'Mayor' ? 'Mayor Natural' : 'Menor Natural');
        setActiveNoteIdx(0);
        setIsTableOpen(false);
        synth.playNote(normalizeNote(note), soundType, 4, 0.8);
      };

      const handleToggleRelative = () => {
        if (modeQuality === 'Mayor') {
          setModeQuality('Menor');
          setSelectedKey(relativeKeyInfo.note);
          setSelectedStructure('Menor Natural');
        } else {
          setModeQuality('Mayor');
          setSelectedKey(relativeKeyInfo.note);
          setSelectedStructure('Mayor Natural');
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-3 py-6 space-y-6">
          
          <header className="flex flex-wrap items-center justify-between bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 shadow-md gap-3">
            <div className="flex items-center space-x-3">
              <div className="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                🎷
              </div>
              <div>
                <h1 className="text-xl font-black text-slate-900 dark:text-amber-400 tracking-tight">
                  Jag2Sax <span className="text-amber-600 dark:text-slate-200">Transpositor</span>
                </h1>
                <p className="text-xs text-slate-600 dark:text-slate-400 font-medium">
                  Herramienta de transposición armónica para Piano y Saxofones
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setIsTableOpen(true)}
                className="bg-amber-100 hover:bg-amber-200 text-amber-900 dark:bg-amber-500/20 dark:text-amber-300 border border-amber-300 dark:border-amber-500/30 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
              >
                📋 Tabla Práctica
              </button>

              {isAdmin && (
                <button 
                  onClick={() => setIsUsersOpen(true)}
                  className="bg-indigo-100 hover:bg-indigo-200 text-indigo-900 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-500/30 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                  title="Panel exclusivo para Administrador"
                >
                  👥 Usuarios ({usersList.length})
                </button>
              )}

              {user ? (
                <div className="flex items-center gap-2 pl-2 border-l border-slate-700">
                  <div className="text-right hidden sm:block">
                    <span className="text-[10px] text-slate-400 block">Hola,</span>
                    <span className="text-xs font-bold text-amber-400">{user.displayName || user.email?.split('@')[0]}</span>
                  </div>
                  <button 
                    onClick={() => signOut(auth)}
                    className="p-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl text-xs font-bold transition"
                    title="Cerrar Sesión"
                  >
                    🚪
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => setIsAuthOpen(true)}
                  className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs transition"
                >
                  Entrar
                </button>
              )}

              <button 
                onClick={() => setDarkMode(!darkMode)}
                className="p-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-xl text-sm transition border border-slate-200 dark:border-slate-700"
              >
                {darkMode ? '☀️' : '🌙'}
              </button>
            </div>
          </header>

          {/* TONALIDAD BASE E INSTRUMENTO */}
          <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md space-y-5">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 pb-3">
              <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                Tonalidad Base e Instrumento
              </h2>

              <button
                onClick={() => setDirection(direction === 'piano-to-sax' ? 'sax-to-piano' : 'piano-to-sax')}
                className="bg-sky-100 hover:bg-sky-200 text-sky-900 dark:bg-sky-500/20 dark:text-sky-300 border border-sky-300 dark:border-sky-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1"
              >
                🔄 {direction === 'piano-to-sax' ? 'Piano ➔ Saxofón' : 'Saxofón ➔ Piano'}
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="text-xs font-bold text-slate-700 dark:text-slate-400 uppercase tracking-wider block mb-2">
                  Modo Armónico:
                </label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => { setModeQuality('Mayor'); setSelectedStructure('Mayor Natural'); }}
                    className={`py-2 text-xs font-bold rounded-xl transition ${
                      modeQuality === 'Mayor' ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                    }`}
                  >
                    ☀️ Mayor
                  </button>
                  <button
                    onClick={() => { setModeQuality('Menor'); setSelectedStructure('Menor Natural'); }}
                    className={`py-2 text-xs font-bold rounded-xl transition ${
                      modeQuality === 'Menor' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                    }`}
                  >
                    🌙 Menor
                  </button>
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-700 dark:text-slate-400 uppercase tracking-wider block mb-2">
                  Sonido de Reproducción:
                </label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setSoundType('piano')}
                    className={`py-2 text-xs font-bold rounded-xl transition ${
                      soundType === 'piano' ? 'bg-slate-800 text-amber-400 border border-amber-500/50' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                    }`}
                  >
                    🎹 German Classical
                  </button>
                  <button
                    onClick={() => setSoundType('sax')}
                    className={`py-2 text-xs font-bold rounded-xl transition ${
                      soundType === 'sax' ? 'bg-amber-500 text-slate-950 shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'
                    }`}
                  >
                    🎷 Saxofón Real
                  </button>
                </div>
              </div>
            </div>

            <div>
              <label className="text-xs font-bold text-slate-700 dark:text-slate-400 uppercase tracking-wider block mb-2">
                Tonalidad en Piano (Concierto / C):
              </label>
              <div className="grid grid-cols-4 sm:grid-cols-6 gap-2">
                {CHROMATIC_SCALE.map((note) => (
                  <button
                    key={note}
                    onClick={() => setSelectedKey(note)}
                    className={`py-2.5 text-sm font-bold rounded-xl border transition ${
                      selectedKey === note
                        ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-md scale-105'
                        : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                    }`}
                  >
                    {note}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="text-xs font-bold text-slate-700 dark:text-slate-400 uppercase tracking-wider block mb-2">
                Selecciona el Tipo de Saxofón:
              </label>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[
                  { name: 'Soprano', tag: 'BB', desc: 'Transposición en Si♭ (+1 Tono arriba)' },
                  { name: 'Alto', tag: 'EB', desc: 'Transposición en Mi♭ (+6ta Mayor / -3 semitones)' },
                  { name: 'Tenor', tag: 'BB', desc: 'Transposición en Si♭ (+1 Tono arriba octava baja)' }
                ].map((sax) => (
                  <div
                    key={sax.name}
                    onClick={() => setSelectedSax(sax.name)}
                    className={`cursor-pointer p-3.5 rounded-2xl border transition flex items-center justify-between ${
                      selectedSax === sax.name
                        ? 'bg-amber-500/10 border-amber-500 text-slate-900 dark:text-amber-300 shadow-md'
                        : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-400'
                    }`}
                  >
                    <div>
                      <h3 className="font-bold text-sm">Saxo {sax.name}</h3>
                      <p className="text-[11px] opacity-75">{sax.desc}</p>
                    </div>
                    <span className="text-xs font-black bg-slate-900 text-amber-400 px-2 py-1 rounded-md">
                      {sax.tag}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-gradient-to-r from-amber-500/20 to-amber-600/10 border border-amber-500/40 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <span className="text-[11px] font-bold text-slate-700 dark:text-amber-400 uppercase tracking-wider block">
                  Tonalidad Resultante para Saxo {selectedSax}:
                </span>
                <span className="text-2xl font-black text-slate-900 dark:text-slate-100">
                  {transposedResultKey}
                </span>
              </div>

              <button
                onClick={handlePlayScale}
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-sm"
              >
                ▶ Escuchar Escala
              </button>
            </div>
          </section>

          {/* ESTRUCTURAS ARMÓNICAS Y ESCALAS */}
          <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
              <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                Estructuras Armónicas y Escalas
              </h2>
              <span className="text-xs font-bold text-slate-500 dark:text-slate-400">
                Modo: {modeQuality}
              </span>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
              <button
                onClick={handleToggleRelative}
                className="flex-shrink-0 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 dark:bg-indigo-500/20 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-500/30 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
              >
                🔄 Ver {relativeKeyInfo.label} ({relativeKeyInfo.key})
              </button>

              {Object.keys(STRUCTURE_TEMPLATES).map((struct) => (
                <button
                  key={struct}
                  onClick={() => setSelectedStructure(struct)}
                  className={`flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                    selectedStructure === struct
                      ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-md'
                      : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                  }`}
                >
                  {struct}
                </button>
              ))}
            </div>

            <div>
              <div className="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 mb-2">
                <span className="font-bold text-slate-900 dark:text-slate-200">
                  Notas y Grados de {selectedStructure.toUpperCase()} ({transposedResultKey})
                </span>
                <span>Haz clic en una nota para ver digitación</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">
                {activeStructureNotes.map((noteObj, idx) => {
                  const isActive = activeNoteIdx === idx;
                  return (
                    <div
                      key={idx}
                      onClick={() => handleSelectNote(idx)}
                      className={`cursor-pointer p-3 rounded-2xl border text-center transition ${
                        isActive
                          ? 'bg-amber-500 text-slate-950 border-amber-600 shadow-lg scale-105'
                          : 'bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                      }`}
                    >
                      <span className="text-[10px] font-black uppercase tracking-wider block opacity-75">
                        {noteObj.degreeName}
                      </span>
                      <span className="text-xl font-black block my-1">
                        {noteObj.note}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          {/* PENTAGRAMA Y DIGITACIÓN */}
          <section className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-md space-y-5">
            <div className="border-b border-slate-200 dark:border-slate-800 pb-3">
              <h2 className="text-base font-bold text-slate-900 dark:text-slate-100">
                Pentagrama y Escala en Clave de Sol (Saxofón)
              </h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Visualización de lectura real en clave de Sol
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              <div className="lg:col-span-2">
                <TrebleClefStaff 
                  notes={activeStructureNotes} 
                  activeNoteIndex={activeNoteIdx}
                  onSelectNote={handleSelectNote}
                />
              </div>

              <div className="lg:col-span-1 flex justify-center">
                <SaxFingeringDiagram 
                  fingering={fingering} 
                  octaveChoice={octaveChoice}
                  setOctaveChoice={setOctaveChoice}
                  isAlt={isAlt}
                  setIsAlt={setIsAlt}
                  hasAltOption={hasAltOption}
                />
              </div>
            </div>
          </section>

          {/* BOTÓN FLOTANTE IA */}
          <button
            onClick={() => setIsGeminiOpen(true)}
            className="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold px-4 py-3 rounded-full shadow-2xl hover:scale-105 transition flex items-center gap-2 text-sm border border-amber-300"
          >
            <span>🎷</span>
            <span>Consultar IA Musical</span>
          </button>

          {/* MODALES */}
          <TableModal 
            isOpen={isTableOpen} 
            onClose={() => setIsTableOpen(false)} 
            onSelectKey={handleSelectFromTable}
          />
          <GeminiModal isOpen={isGeminiOpen} onClose={() => setIsGeminiOpen(false)} />
          <AuthModal isOpen={isAuthOpen} onClose={() => setIsAuthOpen(false)} user={user} />
          
          {isAdmin && (
            <UsersListModal isOpen={isUsersOpen} onClose={() => setIsUsersOpen(false)} usersList={usersList} />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
